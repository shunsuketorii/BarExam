.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}.qtitle{font-size:18px;font-weight:700;margin-bottom:12px}.qbody{white-space:pre-wrap;font-size:15px;line-height:1.85;margin-bottom:18px}.options{display:flex;flex-direction:column;gap:8px}.opt{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;cursor:pointer;white-space:pre-wrap;line-height:1.65;margin-bottom:7px;width:100%;box-sizing:border-box}.opt:hover{background:#f8fafc}.optionNo{display:inline-block;min-width:1.5em;flex:0 0 auto}.optionText{display:block;flex:1;min-width:0}.opt input{margin-right:8px}.statement{border-top:1px solid #eee;padding:12px 0}.statement:first-child{border-top:0}.statementText{font-size:14px;font-weight:600;margin-bottom:7px;white-space:pre-wrap;line-height:1.75}.binaryChoices{display:flex;gap:8px}.bin{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 14px;cursor:pointer}.bin.selected{border-color:var(--accent);background:#eff6ff}.bin.correct{border-color:var(--good);background:#f0fdf4}.bin.wrong{border-color:var(--bad);background:#fef2f2}.feedback{margin-top:16px;padding:12px;border-radius:8px;display:none}.feedback.show{display:block}.feedback.good{background:#f0fdf4;color:var(--good)}.feedback.bad{background:#fef2f2;color:var(--bad)}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}.score{font-size:14px;color:var(--muted)}

<script>
const DATA=[{"category":"憲法・行政法","subject":"憲法","number":1,"body":"〔第１問〕（配点：３）人権の享有主体に関する次のアからウまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからウの順に［No.１］から［No.３］）ア．憲法の人権規定が性質上可能な限り法人（団体）にも適用されるとする見解は、高度に組織された現代社会においては、法人（団体）の活動を、これを構成する自然人の行為に分解・還元することは非現実的であるということを根拠にできない。［No.１］イ．最高裁判所は、指紋押なつ拒否事件判決（最高裁判所平成７年１２月１５日第三小法廷判決、刑集４９巻１０号８４２頁）において、みだりに指紋の押なつを強制されない自由の保障は我が国に在留する外国人にも等しく及ぶとした。［No.２］ウ．天皇・皇族も人権の享有主体としての「国民」に含まれると考えることは、皇位の世襲と職務の特殊性を理由に、その財産権に対して一定の制約がなされることを排除するものではない。［No.３］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．憲法の人権規定が性質上可能な限り法人（団体）にも適用されるとする見解は、高度に組織された現代社会においては、法人（団体）の活動を、これを構成する自然人の行為に分解・還元することは非現実的であるということを根拠にできない。［No.１］"],["イ","イ．最高裁判所は、指紋押なつ拒否事件判決（最高裁判所平成７年１２月１５日第三小法廷判決、刑集４９巻１０号８４２頁）において、みだりに指紋の押なつを強制されない自由の保障は我が国に在留する外国人にも等しく及ぶとした。［No.２］"],["ウ","ウ．天皇・皇族も人権の享有主体としての「国民」に含まれると考えることは、皇位の世襲と職務の特殊性を理由に、その財産権に対して一定の制約がなされることを排除するものではない。［No.３］"]],"answer":"211"},{"category":"憲法・行政法","subject":"憲法","number":2,"body":"〔第２問〕（配点：２）憲法の明文で規定されていない権利・自由に関する次のアからウまでの各記述について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［No.４］）ア．最高裁判所は、人格的生存に関わる重要な権利として、自己の意思に反して身体への侵襲を受けない自由が憲法第１３条によって保障されているとした上、生殖を不能にする手術は生殖能力の喪失という重大な結果をもたらす身体への侵襲であり、正当な理由に基づかずに上記手術を受けることを強制することは、同条に反し許されないとした。イ．最高裁判所は、前科及び犯罪経歴のある者も前科等をみだりに公開されないという法律上の保護に値する利益を有するとした上、弁護士法に基づく照会を必要とする事由として「裁判所に提出するため」とあったにすぎない場合に、市区町村長が、漫然と当該照会に応じ、犯罪の種類、軽重を問わず、前科等の全てを報告することは、公権力の違法な行使に当たるとした。ウ．最高裁判所は、個人の私生活上の自由の一つとして、自己に関する情報をコントロールする権利が憲法第１３条によって保障されているとした上、行政手続における特定の個人を識別するための番号の利用等に関する法律に基づき、行政機関等が個人番号をその内容に含む個人情報の利用、提供等をする行為は、上記権利を侵害するものではないとした。","options":[["1","ア○   イ○   ウ○   ２．ア○   イ○   ウ×      ３．ア○   イ×   ウ○"],["4","ア○   イ×   ウ×   ５．ア×   イ○   ウ○      ６．ア×   イ○   ウ×"],["7","ア×   イ×   ウ○   ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"憲法・行政法","subject":"憲法","number":3,"body":"〔第３問〕（配点：３）表現の自由に関する次のアからウまでの各記述について、ｂの見解がａの見解の根拠となっている場合には１を、そうでない場合には２を選びなさい。（解答欄は、アからウの順に［No.５］から［No.７］）ア．ａ．表現行為に対する事前抑制は、予測に基づくものとなるため、事後制裁の場合よりも広汎にわたりやすく、厳格かつ明確な要件のもとにおいてのみ許容され得るものであり、雑誌その他の出版物の販売等の仮処分による事前差止めの可否は慎重な検討を要する。ｂ．雑誌その他の出版物の販売等の仮処分による事前差止めは、口頭弁論を必要的とせず、立証も疎明で足りるなど簡略な手続によるものであるが、司法裁判所が当事者の申請に基づき差止請求権等の私法上の被保全権利の存否、保全の必要性の有無を審理判断して発するものであって、憲法第２１条第２項にいう「検閲」には当たらない。［No.５］イ．ａ．誤った言論に対する最も適切な救済方法は言論であるべきであるが、その表現内容が真実に反するものであって、他人の人格権としての名誉を侵害し、毀損する場合においては、人格権の保護の観点から、表現の自由には限界が付される。ｂ．誤った言論についても、自由な討論に有益なものとして積極的に是認し得る面があり、真実に反する言論を表現する自由を保障する必要性や有益性があることは否定できないが、全ての言論が同程度の保護を受けるわけではない。［No.６］ウ．ａ．表現行為に刑罰という重大な制裁が科されるとして、罰則規定が不明確であったり、広汎であったりする場合には、表現に対する萎縮効果が生じてしまうため、法令の文面のみにおいて憲法適合性が審査されなければならない。ｂ．被告人の行為が、ある法令が公共の平穏を維持するために規制しようとする典型的な行為である場合に、罰則規定の不明確性、広汎性を理由に被告人を無罪とすることは、国民の視点からは理解を得られにくい。［No.７］","options":[],"binary":false,"chooseTwo":false,"statements":[],"answer":"212"},{"category":"憲法・行政法","subject":"憲法","number":4,"body":"〔第４問〕（配点：２）学問の自由に関する次のアからウまでの各記述について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［No.８］）ア．学問研究のうち内面的精神活動にとどまるものは、思想の自由と同様に絶対的に保障されるべきであるが、それにとどまらないものは、生命・健康に対する重大な危害に対処するため、法律により必要最小限度の制約を課すことも許される。イ．最高裁判所は、憲法第２３条が大学において保障しているのは学問研究の自由と研究結果の発表の自由であって、大学の人事権及び施設と学生の管理権は大学の自治として伝統的に認められているものにすぎず、学問の自由の保障とは関係がないとした。ウ．最高裁判所は、普通教育の場において使用される教科書も学術研究の結果の発表を目的とするものであるが、児童生徒には批判能力がなく、一方的な観念を児童生徒に植え付けるような内容の教育を施すことは許されないから、教科書検定制度は憲法第２３条の規定に違反しないとした。","options":[["1","ア○    イ○   ウ○   ２．ア○   イ○   ウ×      ３．ア○   イ×   ウ○"],["4","ア○    イ×   ウ×   ５．ア×   イ○   ウ○      ６．ア×   イ○   ウ×"],["7","ア×    イ×   ウ○   ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"憲法・行政法","subject":"憲法","number":5,"body":"〔第５問〕（配点：２）憲法第２６条に関する次のアからウまでの各記述について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［No.９］）ア．教育を受ける権利の背後には、国民各自が成長するために必要な学習をする固有の権利を有し、特に、自ら学習することのできない子どもは、その学習要求を充足するための教育を自己に施すことを大人一般に対して要求する権利を有するとの観念が存在しており、教育を受ける権利は、国家に対して合理的な教育制度の整備とそこでの適切な教育を要求するものであって社会権的側面を有するが、自由権的側面は有しない。イ．判例によれば、高等学校の教育は、義務教育とは異なり、高等普通教育及び専門教育を施すことを目的としていることから、教師には広い裁量が認められており、学習指導要領が全国的な大綱的基準としての性格を持つとしても、その基準に従う必要はなく、また、教科書使用義務もない。ウ．判例によれば、憲法第２６条は、全ての国民に対して教育を受ける機会均等の権利を保障するとともに、保護者に対し子どもに最少限度の普通教育を受けさせることにつき、義務教育の制度とその無償を定めているが、義務教育の無償とは、授業料不徴収の意味と解するのが相当であり、教科書や学用品の費用まで無償としなければならないわけではない。","options":[["1","ア○   イ○   ウ○   ２．ア○   イ○   ウ×      ３．ア○   イ×   ウ○"],["4","ア○   イ×   ウ×   ５．ア×   イ○   ウ○      ６．ア×   イ○   ウ×"],["7","ア×   イ×   ウ○   ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"7"},{"category":"憲法・行政法","subject":"憲法","number":6,"body":"〔第６問〕（配点：２）憲法第３１条ないし第３８条に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［No.10］）ア．行政手続については、それが刑事手続ではないとの理由のみで、当然に憲法第３１条による保障の枠外にあるとすることは相当ではなく、行政処分により制限を受ける権利利益の内容、性質、制限の程度、行政処分により達成しようとする公益の内容、程度、緊急性等のいかんにかかわらず、行政処分の相手方に対して事前に告知、弁解、防御の機会を与える旨の規定がなければ同条の法意に反する。イ．憲法第３５条の下では、住居、書類及び所持品について、令状なく、侵入、捜索及び押収ができるのは、現行犯逮捕の場合及び緊急逮捕の場合に限られ、現に逮捕されていることを要するから、緊急逮捕に先立ち捜索及び押収を開始することが憲法上許容されることはない。ウ．憲法第３８条の不利益供述強要の禁止の保障は、刑事手続以外の手続にも及ぶところ、正規の手続を経ていない麻薬の取扱いに関する事実を帳簿に記入させることは、その違反行為の発覚の端緒となるものであるから、取締法規をもって、かかる事実を帳簿に記入すべき義務を課し、当該義務違反が罪を構成するとするのは同条に違反する。","options":[["1","ア○   イ○   ウ○   ２．ア○   イ○   ウ×      ３．ア○   イ×   ウ○"],["4","ア○   イ×   ウ×   ５．ア×   イ○   ウ○      ６．ア×   イ○   ウ×"],["7","ア×   イ×   ウ○   ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"8"},{"category":"憲法・行政法","subject":"憲法","number":7,"body":"〔第７問〕（配点：３）政党に関する次のアからウまでの各記述について、最高裁判所の判例の趣旨に照らして、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからウの順に［No.11］から［No.13］）ア．労働組合は、労働者の労働条件の維持改善その他経済的地位の向上を図ることを主たる目的とする団体であるから、組織として支持政党又はいわゆる統一候補を決定し、その選挙運動を推進したり、組合出身の立候補者の選挙運動を支援する目的でその所属政党に寄付するための資金を組合員から強制的に徴収することも許される。［No.11］イ．衆議院議員小選挙区選挙における政見放送を、候補者届出政党にのみ認め、これに所属しない候補者に認めない旨の公職選挙法の規定は、単なる程度の違いを超える差異を設けるものであるが、その余の選挙運動については候補者届出政党に所属しない候補者も十分に行うことができることからすれば、国会の合理的裁量の限界を超えているということはできない。［No.12］ウ．拘束名簿式比例代表制の下では、投票後に行われる政党による除名は、名簿登載者及び順位を考慮してされた選挙人の投票についての意思を無視することになるから、比例代表選挙において欠員が生じた際の繰上補充に当たり、政党から名簿登載者につき除名届出がされたため被除名者より下位の名簿登載者を当選人とした選挙会の決定は、除名が不存在又は無効であるときには、その効力を有しない。［No.13］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．労働組合は、労働者の労働条件の維持改善その他経済的地位の向上を図ることを主たる目的とする団体であるから、組織として支持政党又はいわゆる統一候補を決定し、その選挙運動を推進したり、組合出身の立候補者の選挙運動を支援する目的でその所属政党に寄付するための資金を組合員から強制的に徴収することも許される。［No.11］"],["イ","イ．衆議院議員小選挙区選挙における政見放送を、候補者届出政党にのみ認め、これに所属しない候補者に認めない旨の公職選挙法の規定は、単なる程度の違いを超える差異を設けるものであるが、その余の選挙運動については候補者届出政党に所属しない候補者も十分に行うことができることからすれば、国会の合理的裁量の限界を超えているということはできない。［No.12］"],["ウ","ウ．拘束名簿式比例代表制の下では、投票後に行われる政党による除名は、名簿登載者及び順位を考慮してされた選挙人の投票についての意思を無視することになるから、比例代表選挙において欠員が生じた際の繰上補充に当たり、政党から名簿登載者につき除名届出がされたため被除名者より下位の名簿登載者を当選人とした選挙会の決定は、除名が不存在又は無効であるときには、その効力を有しない。［No.13］"]],"answer":"212"},{"category":"憲法・行政法","subject":"憲法","number":8,"body":"〔第８問〕（配点：２）司法権の独立に関する次のアからオまでの各記述について、正しいものの組合せを、後記１から５までの中から選びなさい。（解答欄は、［No.14］）ア．憲法第７８条後段は、「裁判官の懲戒処分は、行政機関がこれを行ふことはできない」と規定しているところ、法律において、裁判官の懲戒は司法行政事務を行う最高裁判所の裁判官会議の議によることとされている。イ．憲法第７６条第３項は、「すべて裁判官は、その良心に従ひ独立してその職権を行」うと規定していることから、裁判官は、客観的法規範と抵触したとしても、自らの信念に従って裁判を行えば足りる。ウ．憲法第７６条第２項前段は、「特別裁判所は、これを設置することができない」と規定していることから、弾劾裁判所による罷免の裁判の当否について、最終的に最高裁判所が判断できる。エ．憲法第６４条第１項は、「国会は、罷免の訴追を受けた裁判官を裁判するため、両議院の議員で組織する弾劾裁判所を設ける」と規定しており、弾劾裁判所は、国会から独立して職権を行うものであるから、国会閉会中も活動することができる。オ．憲法第６４条第２項は、「弾劾に関する事項は、法律でこれを定める」と規定し、弾劾裁判に必要な手続については法律に委任しているところ、法律において、罷免の訴追及び罷免の裁判の宣告に当たって、最高裁判所による訴追請求の存在は必ずしも必要とされていない。","options":[["1","ア    イ    ２．ア   オ   ３．イ   ウ           ４．ウ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"憲法・行政法","subject":"憲法","number":9,"body":"〔第９問〕（配点：３）違憲判断の方法に関する次のアからウまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからウの順に［No.15］から［No.17］）ア．沖縄代理署名訴訟判決（最高裁判所平成８年８月２８日大法廷判決、民集５０巻７号１９５２頁）は、日米安全保障条約及び日米地位協定は高度の政治性を有する条約であることから、その憲法適合性の判断は司法審査権の範囲外にあるので、これらの条約が合憲であることを前提とした上で、それらの条約に基づく義務を履行するために制定された駐留軍用地特別措置法の憲法適合性を判断すべきであるとした。［No.15］イ．徳島市公安条例事件判決（最高裁判所昭和５０年９月１０日大法廷判決、刑集２９巻８号４８９頁）は、当該事案におけるだ行進は、秩序正しく平穏な集団行進等に随伴する交通秩序阻害の程度を超えて、殊更に交通秩序の阻害をもたらすような行為にあたるものと容易に想到することができるとして、当該条例が定める「交通秩序を維持すること」という文言の明確性の判断には及ばなかった。［No.16］ウ．最高裁判所の判決（最高裁判所昭和５１年４月１４日大法廷判決、民集３０巻３号２２３頁）は、憲法に違反する議員定数配分規定に基づいて行われた衆議院議員選挙を無効とする判決をしても、これによって直ちに違憲状態が是正されるわけではなく、かえって憲法の所期するところに必ずしも適合しない結果を生ずる等の理由から、当該選挙を無効とする旨の判決を求める請求を棄却し、当該選挙が違法である旨を主文で宣言した。［No.17］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．沖縄代理署名訴訟判決（最高裁判所平成８年８月２８日大法廷判決、民集５０巻７号１９５２頁）は、日米安全保障条約及び日米地位協定は高度の政治性を有する条約であることから、その憲法適合性の判断は司法審査権の範囲外にあるので、これらの条約が合憲であることを前提とした上で、それらの条約に基づく義務を履行するために制定された駐留軍用地特別措置法の憲法適合性を判断すべきであるとした。［No.15］"],["イ","イ．徳島市公安条例事件判決（最高裁判所昭和５０年９月１０日大法廷判決、刑集２９巻８号４８９頁）は、当該事案におけるだ行進は、秩序正しく平穏な集団行進等に随伴する交通秩序阻害の程度を超えて、殊更に交通秩序の阻害をもたらすような行為にあたるものと容易に想到することができるとして、当該条例が定める「交通秩序を維持すること」という文言の明確性の判断には及ばなかった。［No.16］"],["ウ","ウ．最高裁判所の判決（最高裁判所昭和５１年４月１４日大法廷判決、民集３０巻３号２２３頁）は、憲法に違反する議員定数配分規定に基づいて行われた衆議院議員選挙を無効とする判決をしても、これによって直ちに違憲状態が是正されるわけではなく、かえって憲法の所期するところに必ずしも適合しない結果を生ずる等の理由から、当該選挙を無効とする旨の判決を求める請求を棄却し、当該選挙が違法である旨を主文で宣言した。［No.17］"]],"answer":"221"},{"category":"憲法・行政法","subject":"憲法","number":10,"body":"〔第10問〕（配点：３）地方自治に関する次のアからウまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからウの順に［No.18］から［No.20］）ア．判例は、憲法第９３条第２項にいう「住民」とは、地方公共団体の区域内に住所を有する日本国民を意味するから、法律により、我が国に在留する外国人に対して地方公共団体の長及び議会の議員の選挙権を付与することは、憲法上一律に禁止されているとした。［No.18］イ．憲法第９４条は、地方公共団体は法律の範囲内で条例を制定することができると規定しているが、判例によれば、条例が法律と同一の目的で法律よりも厳しい規制基準を定めているとしても、そのことから直ちに条例が法律に違反することにはならない。［No.19］ウ．憲法第９５条にいう「一の地方公共団体のみに適用される特別法」には、特定の複数の地方公共団体に適用される法律も含まれるが、これまでに同条に基づく住民投票が実施された法律は、一つの地方公共団体のみに適用されるものに限られる。［No.20］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．判例は、憲法第９３条第２項にいう「住民」とは、地方公共団体の区域内に住所を有する日本国民を意味するから、法律により、我が国に在留する外国人に対して地方公共団体の長及び議会の議員の選挙権を付与することは、憲法上一律に禁止されているとした。［No.18］"],["イ","イ．憲法第９４条は、地方公共団体は法律の範囲内で条例を制定することができると規定しているが、判例によれば、条例が法律と同一の目的で法律よりも厳しい規制基準を定めているとしても、そのことから直ちに条例が法律に違反することにはならない。［No.19］"],["ウ","ウ．憲法第９５条にいう「一の地方公共団体のみに適用される特別法」には、特定の複数の地方公共団体に適用される法律も含まれるが、これまでに同条に基づく住民投票が実施された法律は、一つの地方公共団体のみに適用されるものに限られる。［No.20］"]],"answer":"212"},{"category":"憲法・行政法","subject":"憲法","number":11,"body":"〔第11問〕（配点：２）条約に関する次のアからウまでの各記述について、正しいものには○、誤っているものには×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［No.21］）ア．条約の締結には国会の承認が必要であることから、条約の締結に先立ち衆議院が条約承認の議決をして参議院に議案を送付し、その後国会休会中の期間を除き３０日以内に参議院が議決をしなかった場合には、内閣は条約を締結することができない。イ．砂川事件判決（最高裁判所昭和３４年１２月１６日大法廷判決、刑集１３巻１３号３２２５頁）は、憲法と条約の効力の優越関係に関して、憲法の最高法規性を定める憲法第９８条第１項や違憲審査権を定める憲法第８１条に条約が列挙されていないことを論拠の一つとする考え方には立脚していない。ウ．憲法第９８条第２項は条約を誠実に遵守すべきことを定めていることから、国会が承認し内閣が締結した条約は、天皇による公布を経なくとも国内法として実施が可能となる点で、法律と異なる。","options":[["1","ア○    イ○   ウ○     ２．ア○   イ○   ウ×      ３．ア○   イ×   ウ○"],["4","ア○    イ×   ウ×     ５．ア×   イ○   ウ○      ６．ア×   イ○   ウ×"],["7","ア×    イ×   ウ○     ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"6"},{"category":"憲法・行政法","subject":"憲法","number":12,"body":"〔第12問〕（配点：３）憲法改正に関する次のアからウまでの各記述について、ｂの見解がａの見解の根拠となっている場合には１を、そうでない場合には２を選びなさい。（解答欄は、アからウの順に［No.22］ から［No.24］）ア．ａ．憲法の定める改正手続に従いさえすれば、いかなる内容の改正を行うことも法的に可能である。ｂ．憲法典における規定は、その内容にかかわらず、全て同一の法価値と形式的効力を有する。［No.22］イ．ａ．憲法改正における国民による承認の要件として、憲法第９６条第１項が定める「過半数」とは、有効投票数の過半数を意味する。ｂ．積極的に賛成の意思表示をしたものが投票の過半数であることが、憲法改正のような重要事項には要請される。［No.23］ウ．ａ．憲法改正案の原案を国会に提出する権限を、法律によって内閣に認めることは許される。ｂ．憲法改正案の原案を国会に提出することは、憲法第９６条第１項にいう「発議」の手続の一部を構成している。［No.24］","options":[],"binary":false,"chooseTwo":false,"statements":[],"answer":"122"},{"category":"憲法・行政法","subject":"行政法","number":13,"body":"〔第13問〕（配点：３）行政処分に関する次のアからエまでの各記述について、最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからエの順に［№25］から［№28］）ア．一旦行政処分が行われた以上、たとえ当該行政処分に重大かつ明白な違法があったとしても、当該行政処分が適法に取り消されない限り、当該行政処分は完全な効力を有する。［№25］イ．税務署長が行った法人税の増額更正処分の附記理由に不備があった場合、後日、当該処分についての審査請求に対する裁決において、当該処分の具体的根拠が明らかにされたとしても、当該処分の附記理由不備の瑕疵は治癒されない。［№26］ウ．行政庁は、相手方に利益を与える行政処分をした場合、法令上その撤回を認める直接の根拠規定がない限り、当該行政処分を撤回することができない。［№27］エ．裁決庁が、行政処分を取り消す認容裁決を行った後に当該裁決の誤りに気付いた場合、当該裁決を職権により取り消すことは、法令に特別の規定のない限り、許されない。［№28］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．一旦行政処分が行われた以上、たとえ当該行政処分に重大かつ明白な違法があったとしても、当該行政処分が適法に取り消されない限り、当該行政処分は完全な効力を有する。［№25］"],["イ","イ．税務署長が行った法人税の増額更正処分の附記理由に不備があった場合、後日、当該処分についての審査請求に対する裁決において、当該処分の具体的根拠が明らかにされたとしても、当該処分の附記理由不備の瑕疵は治癒されない。［№26］"],["ウ","ウ．行政庁は、相手方に利益を与える行政処分をした場合、法令上その撤回を認める直接の根拠規定がない限り、当該行政処分を撤回することができない。［№27］"],["エ","エ．裁決庁が、行政処分を取り消す認容裁決を行った後に当該裁決の誤りに気付いた場合、当該裁決を職権により取り消すことは、法令に特別の規定のない限り、許されない。［№28］"]],"answer":"2121"},{"category":"憲法・行政法","subject":"行政法","number":14,"body":"〔第14問〕（配点：２）行政手続法上の意見公募手続に関する次のアからウまでの各記述について、同法に照らし、正しいものに○、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［№29］）ア．命令等制定機関は、命令等を定めようとする場合において、３０日以上の意見提出期間を定めることができないやむを得ない理由があるときは、３０日を下回る意見提出期間を定めることができる。イ．命令等制定機関が、命令等を定めようとする場合において、当該命令等の案に加えて、これに関連する資料をあらかじめ公示するか否かは、当該命令等制定機関の裁量に委ねられている。ウ．命令等制定機関は、委員会等の議を経て命令等を定めようとする場合において、当該委員会等が意見公募手続に準じた手続を実施したときであっても、自ら意見公募手続を実施しなければならない。","options":[["1","ア○    イ○   ウ○   ２．ア○   イ○   ウ×      ３．ア○   イ×   ウ○"],["4","ア○    イ×   ウ×   ５．ア×   イ○   ウ○      ６．ア×   イ○   ウ×"],["7","ア×    イ×   ウ○   ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"憲法・行政法","subject":"行政法","number":15,"body":"〔第15問〕（配点：３）国家公務員法（以下「法」という。）に基づく職員の懲戒処分と裁量審査について述べた最高裁判所昭和５２年１２月２０日第三小法廷判決（民集３１巻７号１１０１頁。以下「本判決」という。）に関する次のアからエまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからエの順に［№30］から［№33］）ア．法第８２条第１項第３号は、懲戒処分の要件として、「国民全体の奉仕者たるにふさわしくない非行のあつた場合」と定めているが、本判決は、この要件が抽象的であるとして、同要件に該当するか否かの判断について懲戒権者に裁量が認められると判断した。［№30］イ．本判決は、法は、懲戒権者が懲戒処分をすべきかどうかについて具体的な基準を設けていないことを理由に、懲戒権者は、諸般の事情を考慮して、懲戒処分をすべきかどうかを決定することができると判断した。［№31］ウ．本判決は、法は、懲戒権者がいかなる懲戒処分を選択すべきかについて具体的な基準を設けていないことを理由に、懲戒権者は、諸般の事情を考慮して、懲戒処分をする場合にいかなる処分を選択すべきかを決定することができると判断した。［№32］エ．本判決は、裁判所において、懲戒処分をすべきであったかどうか又はいかなる処分を選択すべきであったかについて検討した結果と実際にされた懲戒処分とを比較して、当該懲戒処分がその結果より重い場合には、当該懲戒処分につき、裁量権を逸脱し又はこれを濫用したとして、違法であると判断すべきものであるとした。［№33］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．法第８２条第１項第３号は、懲戒処分の要件として、「国民全体の奉仕者たるにふさわしくない非行のあつた場合」と定めているが、本判決は、この要件が抽象的であるとして、同要件に該当するか否かの判断について懲戒権者に裁量が認められると判断した。［№30］"],["イ","イ．本判決は、法は、懲戒権者が懲戒処分をすべきかどうかについて具体的な基準を設けていないことを理由に、懲戒権者は、諸般の事情を考慮して、懲戒処分をすべきかどうかを決定することができると判断した。［№31］"],["ウ","ウ．本判決は、法は、懲戒権者がいかなる懲戒処分を選択すべきかについて具体的な基準を設けていないことを理由に、懲戒権者は、諸般の事情を考慮して、懲戒処分をする場合にいかなる処分を選択すべきかを決定することができると判断した。［№32］"],["エ","エ．本判決は、裁判所において、懲戒処分をすべきであったかどうか又はいかなる処分を選択すべきであったかについて検討した結果と実際にされた懲戒処分とを比較して、当該懲戒処分がその結果より重い場合には、当該懲戒処分につき、裁量権を逸脱し又はこれを濫用したとして、違法であると判断すべきものであるとした。［№33］"]],"answer":"2112"},{"category":"憲法・行政法","subject":"行政法","number":16,"body":"〔第16問〕（配点：３）行政指導に関する教員と学生による以下の対話中の次のアからエまでの【      】内の各記述について、行政手続法又は最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからエの順に［№34］から［№37］）教員：我が国の行政の特徴として、行政指導が多用されている点が挙げられますが、行政指導のメリットとして、どのようなことが考えられますか。学生：（ア）【行政指導は、行政機関がその任務又は所掌事務の範囲を超えて行うことができます。】そのため、行政需要に対し臨機応変に対応することが可能です。［№34］教員：行政指導のデメリットとして、内容や責任の所在が不明確になりがちであると指摘されていますが、この問題につき、行政手続法はどのように対処していますか。学生：（イ）【行政指導が口頭でされるか書面でされるかを問わず、行政指導に携わる者は、その相手方に対して、当該行政指導の趣旨及び内容並びに責任者を明確に示さなければならないとされています。】［№35］教員：一般的には、行政指導に公権力性はなく、処分性は認められませんが、違法な行政指導がされた場合に、相手方が不服を申し出る手段はありますか。学生：行政手続法に基づき行政指導の中止その他必要な措置をとることを求めることができますが、（ウ）【中止等の求めの対象は、法令に違反する行為の是正を求める行政指導であって、その根拠となる規定が法律に置かれているものに限られます。】［№36］教員：それでは、違法な行政指導により損害を被った場合の賠償請求の方法として、どのようなものが考えられますか。学生：（エ）【行政指導は、国家賠償法第１条第１項にいう「公権力の行使」に当たらないため、専ら民法上の不法行為に基づく損害賠償請求によることとなります。】［№37］","options":[],"binary":true,"chooseTwo":false,"statements":[],"answer":"2112"},{"category":"憲法・行政法","subject":"行政法","number":17,"body":"〔第17問〕（配点：２）行政上の義務の履行確保に関する次のアからウまでの各記述について、法令又は最高裁判所の判例に照らし、正しいものに〇、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［№38］）ア．国又は地方公共団体は、私人に対する金銭債権の強制執行に当たり、当該債権について行政上の強制徴収手続に係る法律の規定が設けられている場合であっても、民事上の強制執行を行うことができる。イ．地方公共団体の条例において、当該条例に違反した者に対して秩序罰として過料を科する旨の規定が設けられている場合、当該地方公共団体の長は、裁判所の手続を要さずに、これを科すことができる。ウ．同一の過少申告の事実について、過少申告加算税の賦課と刑事手続による刑罰とを併科することはできない。","options":[["1","ア〇   イ〇   ウ〇   ２．ア〇   イ〇   ウ×       ３．ア〇   イ×   ウ〇"],["4","ア〇   イ×   ウ×   ５．ア×   イ〇   ウ〇       ６．ア×   イ〇   ウ×"],["7","ア×   イ×   ウ〇   ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"6"},{"category":"憲法・行政法","subject":"行政法","number":18,"body":"〔第18問〕（配点：３）行政機関の保有する情報の公開に関する法律に基づく行政文書の開示請求に関する次のアからエまでの各記述について、同法に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからエの順に［№39］から［№42］）ア．内閣に対し独立の地位を有する会計検査院は、開示請求の対象となる行政文書を保有する行政機関には含まれない。［№39］イ．行政機関の長は、開示請求をした者に対して開示請求書の補正を求める場合には、補正の参考となる情報を提供するよう努めなければならない。［№40］ウ．行政機関の長は、開示請求に係る行政文書が他の行政機関により作成されたものであるときには、当該他の行政機関の長と協議の上、当該他の行政機関の長に対し、事案を移送することができる。［№41］エ．開示請求をした者は、行政機関の長が、開示請求をした日から３０日以内に、開示請求に対する決定をせず、かつ、上記３０日の期間を延長する旨の通知をしない場合には、当該行政機関の長が開示をしない旨の決定をしたものとみなし、その取消しの訴えを提起することができる。［№42］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．内閣に対し独立の地位を有する会計検査院は、開示請求の対象となる行政文書を保有する行政機関には含まれない。［№39］"],["イ","イ．行政機関の長は、開示請求をした者に対して開示請求書の補正を求める場合には、補正の参考となる情報を提供するよう努めなければならない。［№40］"],["ウ","ウ．行政機関の長は、開示請求に係る行政文書が他の行政機関により作成されたものであるときには、当該他の行政機関の長と協議の上、当該他の行政機関の長に対し、事案を移送することができる。［№41］"],["エ","エ．開示請求をした者は、行政機関の長が、開示請求をした日から３０日以内に、開示請求に対する決定をせず、かつ、上記３０日の期間を延長する旨の通知をしない場合には、当該行政機関の長が開示をしない旨の決定をしたものとみなし、その取消しの訴えを提起することができる。［№42］"]],"answer":"2112"},{"category":"憲法・行政法","subject":"行政法","number":19,"body":"〔第19問〕（配点：３）訴えの利益に関する次のアからエまでの各記述について、最高裁判所の判例に照らし、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからエの順に［№43］から［№46］）ア．建築基準法に基づく建築確認を受けた建築物の工事が完了した場合は、当該建築確認の取消しを求める訴えの利益は失われる。［№43］イ．免職処分を受けた公務員が、その後市議会議員選挙の候補者となり、公職選挙法の規定により公務員を退職したものとみなされることになる場合は、当該免職処分の取消しを求める訴えの利益は失われる。［№44］ウ．当初の更正処分における所得金額を増額する再更正処分がされた場合は、当初の更正処分の取消しを求める訴えの利益は失われる。［№45］エ．自動車運転免許の効力停止処分がされた場合は、当該運転免許の効力停止期間の経過により、その時点で当該効力停止処分の取消しを求める訴えの利益は失われる。［№46］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．建築基準法に基づく建築確認を受けた建築物の工事が完了した場合は、当該建築確認の取消しを求める訴えの利益は失われる。［№43］"],["イ","イ．免職処分を受けた公務員が、その後市議会議員選挙の候補者となり、公職選挙法の規定により公務員を退職したものとみなされることになる場合は、当該免職処分の取消しを求める訴えの利益は失われる。［№44］"],["ウ","ウ．当初の更正処分における所得金額を増額する再更正処分がされた場合は、当初の更正処分の取消しを求める訴えの利益は失われる。［№45］"],["エ","エ．自動車運転免許の効力停止処分がされた場合は、当該運転免許の効力停止期間の経過により、その時点で当該効力停止処分の取消しを求める訴えの利益は失われる。［№46］"]],"answer":"1212"},{"category":"憲法・行政法","subject":"行政法","number":20,"body":"〔第20問〕（配点：２）取消訴訟に関する次のアからウまでの各記述について、法令又は最高裁判所の判例に照らし、正しいものに〇、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［№47］）ア．裁判所は、取消しが求められた処分の根拠となる法令が事実審の口頭弁論終結時までに改正された場合には、改正後の法令の内容に従って当該処分の当否を判断しなければならない。イ．裁判所は、取消訴訟の目的である請求を当該処分又は裁決に係る事務の帰属する国又は公共団体に対する損害賠償請求に変更することが相当であると認めるときは、請求の基礎に変更がない限り、口頭弁論の終結に至るまで、原告の申立てにより、訴えの変更を許すことができる。ウ．取消訴訟については民事訴訟法の検証に関する規定が準用されていないから、裁判所は、検証の目的物の所持者にその提示を命ずることはできない。","options":[["1","ア○   イ○   ウ○   ２．ア○   イ○   ウ×       ３．ア○   イ×   ウ○"],["4","ア○   イ×   ウ×   ５．ア×   イ○   ウ○       ６．ア×   イ○   ウ×"],["7","ア×   イ×   ウ○   ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"6"},{"category":"憲法・行政法","subject":"行政法","number":21,"body":"〔第21問〕（配点：２）抗告訴訟に関する次のアからウまでの各記述について、行政事件訴訟法に照らし、正しいものに〇、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［№48］）ア．不作為の違法確認の訴えは、処分又は裁決について適法な申請をした者に限り、提起することができる。イ．無効等確認の訴えは、個別法において取消訴訟の提起に際し審査請求の前置が定められている処分についても、審査請求に対する裁決を経ないで提起することができる。ウ．無効の処分には執行力がないから、無効等確認の訴えについては執行停止の規定が準用されていない。","options":[["1","ア○   イ○   ウ○   ２．ア○   イ○   ウ×       ３．ア○   イ×   ウ○"],["4","ア○   イ×   ウ×   ５．ア×   イ○   ウ○       ６．ア×   イ○   ウ×"],["7","ア×   イ×   ウ○   ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"6"},{"category":"憲法・行政法","subject":"行政法","number":22,"body":"〔第22問〕（配点：２）行政事件訴訟法上の仮の救済に関する次のアからウまでの各記述について、同法に照らし、正しいものに〇、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［№49］）ア．執行停止の申立ては、処分、処分の執行又は手続の続行により生ずる重大な損害を避けるため緊急の必要がある場合にされるものであるから、本案訴訟の提起は申立ての要件とされていない。イ．仮の差止めの決定は、公共の福祉に重大な影響を及ぼすおそれがある場合であっても、処分又は裁決がされることにより生ずる償うことのできない損害を避けるため緊急の必要があるときは、することができる。ウ．内閣総理大臣の異議は、裁判所が仮の義務付けの決定をする前のみならず、仮の義務付けの決定をした後であっても、これを述べることができる。","options":[["1","ア○   イ○   ウ○   ２．ア○   イ○   ウ×       ３．ア○   イ×   ウ○"],["4","ア○   イ×   ウ×   ５．ア×   イ○   ウ○       ６．ア×   イ○   ウ×"],["7","ア×   イ×   ウ○   ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"7"},{"category":"憲法・行政法","subject":"行政法","number":23,"body":"〔第23問〕（配点：２）国家賠償法第１条第１項に関する次のアからウまでの各記述について、最高裁判所の判例に照らし、正しいものに〇、誤っているものに×を付した場合の組合せを、後記１から８までの中から選びなさい。（解答欄は、［№50］）ア．刑事事件において、上告審で確定した有罪判決が再審で取り消され、無罪判決が確定した場合、検察官の公訴の提起及び追行は、そのことによって国家賠償法第１条第１項の適用上違法の評価を受ける。イ．建築主事が、建築士の設計に係る建築物の計画について、建築主から建築確認の申請を受けた際、職務上通常払うべき注意をもって申請書類の記載を確認していればその記載から当該計画の建築基準関係規定への不適合を発見することができたにもかかわらず、その注意を怠って漫然とその不適合を看過した結果、当該計画につき建築確認を行ったと認められる場合、当該建築確認は、国家賠償法第１条第１項の適用上違法の評価を受ける。ウ．国又は公共団体の公務員による規制権限の不行使は、その権限を定めた法令の趣旨、目的や、その権限の性質等に照らし、具体的事情の下において、その権限を行使することが社会通念上期待される状況にあったときは、その権限の不行使により被害を受けた者との関係において、国家賠償法第１条第１項の適用上違法の評価を受ける。","options":[["1","ア〇   イ〇   ウ〇   ２．ア〇   イ〇   ウ×       ３．ア〇   イ×   ウ〇"],["4","ア〇   イ×   ウ×   ５．ア×   イ〇   ウ〇       ６．ア×   イ〇   ウ×"],["7","ア×   イ×   ウ〇   ８．ア×   イ×   ウ×"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"6"},{"category":"憲法・行政法","subject":"行政法","number":24,"body":"〔第24問〕（配点：３）行政組織に関する次のアからエまでの各記述について、それぞれ正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからエの順に［№51］から［№54］）ア．下級行政庁が権限の行使をしない場合に、上級行政庁が下級行政庁の権限を代わって行使することは、法律の根拠がなくても、一般的な指揮監督権に基づくものとして許される。［№51］イ．デジタル社会の形成に関する内閣の事務を助け、デジタル社会の形成に関する行政事務の迅速かつ重点的な遂行を図るため、内閣府の外局としてデジタル庁が設置されている。［№52］ウ．内閣府・省の外局として設置されている委員会は、大臣の所轄の下に置かれ、職権行使の独立性が保障されている。［№53］エ．独立行政法人及び国立大学法人の役員及び職員は、それらの法人の事務の公共性に鑑み、いずれも国家公務員とされている。［№54］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．下級行政庁が権限の行使をしない場合に、上級行政庁が下級行政庁の権限を代わって行使することは、法律の根拠がなくても、一般的な指揮監督権に基づくものとして許される。［№51］"],["イ","イ．デジタル社会の形成に関する内閣の事務を助け、デジタル社会の形成に関する行政事務の迅速かつ重点的な遂行を図るため、内閣府の外局としてデジタル庁が設置されている。［№52］"],["ウ","ウ．内閣府・省の外局として設置されている委員会は、大臣の所轄の下に置かれ、職権行使の独立性が保障されている。［№53］"],["エ","エ．独立行政法人及び国立大学法人の役員及び職員は、それらの法人の事務の公共性に鑑み、いずれも国家公務員とされている。［№54］"]],"answer":"2212"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":1,"body":"〔第１問〕（配点：２）未成年者に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№１］）ア．未成年者が法定代理人の同意を得ないで負担付贈与の申込みを承諾したときは、未成年者は、これを取り消すことができる。イ．法定代理人が目的を定めて処分を許した財産について、未成年者がその目的の範囲外の処分をした場合は、その処分の相手方が目的の範囲外の処分であることを知り、又は知ることができたときに限り、法定代理人は、その処分を取り消すことができる。ウ．法定代理人が未成年者に営業を許可した後、その営業に堪えることができない事由が生じたため、法定代理人がその許可を取り消したときは、その取消しは、将来に向かってのみその効力を生ずる。エ．法定代理人の同意を得ないで締結した売買契約により代金債務を負担した未成年者が、成年に達した時以後に、取消権を有することを知った上で、異議をとどめないでその代金債務の弁済をしたときであっても、その契約の当時法定代理人であった者は、その契約を取り消すことができる。オ．未成年者のした法律行為の相手方が、未成年者に対し、１か月以上の期間を定めて、その期間内に法定代理人の追認を得るべき旨の催告をし、その未成年者がその期間内にその追認を得た旨の通知を発しないときは、その法律行為を取り消したものとみなされる。","options":[["1","ア    イ      ２．ア   ウ   ３．イ   オ           ４．ウ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":2,"body":"〔第２問〕（配点：２）意思表示に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№２］）ア．ＡがＢの詐欺によりＢに対し甲建物を贈与した場合において、Ａが詐欺による意思表示の取消しをする前に、詐欺の事実を過失なく知らなかったＣが甲建物についてＢから抵当権の設定を受けたときは、Ａは、その意思表示を取り消すことができない。イ．意思表示が、これに対応する意思を欠く錯誤に基づくものであり、かつ、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものである場合において、その錯誤が表意者の重大な過失によるものであったときは、相手方が表意者に錯誤があることを知り、又は重大な過失により知らなかったときに限り、表意者は、その意思表示を取り消すことができる。ウ．Ａが、契約を解除する旨の意思表示の通知をＢに発した後に意思能力を喪失した場合であっても、その通知がＢに到達したときは、その意思表示は、効力を生ずる。エ．表意者が強迫による意思表示を取り消すためには、強迫者に、強迫行為によって表意者に畏怖を生じさせる故意と、その畏怖により表意者に意思表示をさせる故意とが必要である。オ．ＡとＢとが通謀し、ＡがＡ所有の甲土地をＢに売る旨を仮装し、ＡからＢへの所有権移転登記がされた後、Ｂが甲土地上に乙建物を建築し、乙建物をＣに賃貸した場合において、Ｃがその賃貸借契約を締結した際にＡＢ間の売買が仮装されたものであることを知らなかったときは、Ａは、Ｃに対し、その売買の意思表示の無効を対抗することができない。","options":[["1","ア    イ      ２．ア   エ   ３．イ   オ           ４．ウ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":3,"body":"〔第３問〕（配点：２）消滅時効に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№３］）ア．催告によって時効の完成が猶予されている間に債権者が再度の催告をしたときは、再度の催告の時から６か月を経過するまでの間は、時効は、完成しない。イ．時効期間が経過する前に、債務者が債権者の代理人に対し支払猶予の申入れをしたときは、時効は、その申入れの時から新たにその進行を始める。ウ．保証人の主たる債務者に対する事前求償権を被保全債権とする仮差押えは、事後求償権についても、時効の完成猶予の効力を有する。エ．夫婦の一方が他方に対して有する権利については、婚姻中に時効期間が満了していたとしても、婚姻の解消の時から６か月を経過するまでの間は、時効は、完成しない。オ．担保権の実行を申し立てた債権者がその申立てを取り下げたときは、被担保債権の時効は、取下げの時から新たにその進行を始める。","options":[["1","ア    イ   ２．ア    オ   ３．イ   ウ           ４．ウ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":4,"body":"〔第４問〕（配点：２）所有権の取得に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№４］）ア．所有者のない不動産は、所有の意思をもって占有することによって、その占有者がその所有権を取得する。イ．Ａの所有する船舶（時価５００万円）に、Ｂの所有する発動機（時価５００万円）が取り付けられた場合において、損傷しなければこれらを分離することができず、かつ、その船舶とその発動機について主従の区別をすることができないときは、発動機付きの船舶は、１対１の割合でＡとＢが共有する。ウ．建物の賃借人が建物の増築をした場合において、その増築部分について構造上及び利用上の独立性が認められるときは、その増築について建物の所有者である賃貸人の了承を得ていなくても、その増築部分の所有権は、賃借人に帰属する。エ．Ａの所有する液体甲（５０立方メートル）が、Ｂの所有する液体乙（１立方メートル）と混和して識別することができなくなり、液体丙（５１立方メートル）となった場合において、Ａが液体丙の所有権を取得したときは、ＢはＡに対し、不当利得の規定に従い、その償金を請求することができる。オ．主従の区別をすることができない甲建物と乙建物にそれぞれ抵当権が設定されていた場合において、これらの建物が工事により一棟の丙建物となったときは、それぞれの抵当権は、丙建物のうち、甲建物と乙建物の価格の割合に応じた持分を目的とするものとして存続する。","options":[["1","ア    イ   ２．ア    ウ   ３．イ   エ           ４．ウ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":5,"body":"〔第５問〕（配点：２）ＡがＡ所有の甲土地にＢのために地上権（以下「本件地上権」という。）を設定する場合に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№５］）ア．本件地上権の存続期間が定められていないときは、本件地上権の設定は、無効である。イ．本件地上権が消滅した場合において、ＡがＢに対し時価相当額を提供して甲土地上の工作物を買い取る旨を通知したときは、異なる慣習がない限り、Ｂは、正当な理由がなければ、これを拒むことができない。ウ．Ｂが本件地上権に係る約定の地代を引き続き２年以上支払わなかったときは、Ａは、その意思表示により本件地上権を消滅させることができる。エ．本件地上権が建物所有を目的とするものである場合において、Ｂが甲土地上に乙建物を建築し、その所有権保存登記をしたときは、Ｂは、地上権設定登記を備えなくても、その後に甲土地をＡから譲り受けたＣに対し、本件地上権の取得を対抗することができる。オ．Ｂが甲土地上に丙建物を建築し、丙建物をＤに賃貸したときは、その後にＢが甲土地の所有権を取得したとしても、本件地上権は消滅しない。","options":[["1","ア    ウ   ２．ア   オ   ３．イ   ウ           ４．イ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":6,"body":"〔第６問〕（配点：２）留置権に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№６］）ア．賃貸人による建物明渡請求に対し、賃借人は、敷金返還請求権を被担保債権とする留置権を行使して建物の明渡しを拒むことができない。イ．建物明渡請求訴訟において、原告の主張する請求原因が全て認められるものの、被告の留置権の抗弁が認められるときは、原告の請求は棄却される。ウ．甲建物の賃借人Ａが賃料を滞納し、賃貸人Ｂにより賃貸借契約が解除された後、Ａが甲建物について有益費を支出したときは、Ａは、Ｂによる甲建物の明渡請求に対し、その有益費の償還請求権を被担保債権とする留置権を行使して甲建物の明渡しを拒むことができる。エ．留置権者は、債務者の承諾を得て留置物を第三者に賃貸したときは、その賃料を留置権の被担保債権の弁済に充当することができる。オ．留置権者が善良な管理者の注意義務に違反したことにより留置物である時計を壊したときは、債務者は、留置権の消滅を請求することができる。","options":[["1","ア    ウ   ２．ア   エ   ３．イ   ウ           ４．イ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":7,"body":"〔第７問〕（配点：２）抵当権に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№７］）ア．現存の債権及び将来発生する可能性のある条件付債権を、現存の貸金債権であるように表示して抵当権設定登記をした場合であっても、当事者が真実その設定した抵当権を登記する意思で登記手続をしたときは、その抵当権の設定は有効である。イ．ＡのＢに対する金銭債権を被担保債権としてＢ所有の甲土地に抵当権が設定されているときは、Ｂは、Ａからの当該金銭債権の履行請求に対し、抵当権設定登記の抹消登記手続と同時でなければ応じないと主張してこれを拒むことはできない。ウ．ＡのＢに対する金銭債権を被担保債権として、物上保証人であるＣ所有の甲土地に抵当権が設定されている場合において、Ｂの債務についてＤが免責的債務引受をしたときは、Ｃが抵当権の移転について承諾していなくても、Ａは、その抵当権をＤが負担する債務に移すことができる。エ．抵当権は、売買契約に基づく目的物の引渡請求権を被担保債権として設定することができない。オ．ＡのＢに対する金銭債権を被担保債権としてＢ所有の甲土地に抵当権が設定され、その旨の登記がされた場合において、Ｂから甲土地の所有権を取得したＣが、その金銭債権の元本のほか、既に発生した利息及び遅延損害金のうち最後の２年分を弁済したときは、抵当権は、消滅する。","options":[["1","ア    イ    ２．ア   エ   ３．イ   ウ           ４．ウ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"1"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":8,"body":"〔第８問〕（配点：２）詐害行為取消権に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№８］）ア．詐害行為取消権を行使するためには、詐害行為時と詐害行為取消請求に係る訴訟の口頭弁論終結時のいずれにおいても債務者が無資力であることが必要である。イ．無資力のＡがＢと離婚し、Ａが負担すべき相当な慰謝料額が３００万円であったにもかかわらず、慰謝料として７００万円を支払うことを合意したときは、Ａの債権者は、Ａが負担すべき相当な慰謝料額を超える４００万円の限度で、この合意について詐害行為取消権を行使することができる。ウ．債権の譲渡行為自体が詐害行為を構成しないときは、当該債権譲渡についてされた譲渡通知のみを切り離し、同譲渡通知に対する詐害行為取消権を行使することはできない。エ．債務者がその有する財産を相当な対価を取得して処分する行為をした場合において、その行為の当時、債務者が隠匿の意思を有し、受益者がそのことを知っていたときは、その行為がその対価を隠匿するおそれを現に生じさせるものでなくても、債権者は、当該行為について詐害行為取消請求をすることができる。オ．詐害行為取消権は、訴訟において行使しなければならないが、訴えによる必要はなく、抗弁によって行使することもできる。","options":[["1","ア    イ    ２．ア   ウ   ３．イ   オ           ４．ウ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":9,"body":"〔第９問〕（配点：２）債務者Ａが債権者Ｂに対して、同種の給付を目的とする債務α、債務βを負っている場合において、Ａが弁済としてした給付が全ての債務を消滅させるものではなかった。この場合にＡの給付がいずれの債務に充当されるかに関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№９］）ア．ＡとＢの間で債務α、債務βの順に充当する旨の合意があるときは、Ａが給付をする際に債務βから充当する旨の指定をしたとしても、その給付は、債務α、債務βの順に充当される。イ．いずれの債務も金銭債務であって利息が発生している場合において、弁済の充当の順序に関する合意がなく、Ａが給付をする際に債務αから充当する旨の指定をしたときは、その給付は、債務αの費用、利息、元本の順に充当され、その後に債務βの費用、利息、元本の順に充当される。ウ．Ａが給付をする際にＡが債務αから充当する旨の指定をしたのに対し、Ｂが直ちに異議を述べたときは、Ａがした弁済の充当の指定は、その効力を生じない。エ．弁済の充当の順序に関する合意がなく、かつ、Ａが給付をする際にＡとＢの双方が弁済の充当の指定をしなかった場合においては、債務α、債務βの順に弁済期が到来したときであっても、債務βの方がＡにとって弁済の利益が多いときは、その給付は、債務βから充当される。オ．弁済の充当の順序に関する合意がなく、かつ、Ａが給付をする際にＡとＢの双方が弁済の充当の指定をしなかった場合において、いずれの債務についても弁済期が同時であり、かつ、いずれの債務についても弁済の利益が等しいときは、その給付は、債務の額に応じて債務α及び債務βに充当される。","options":[["1","ア    ウ      ２．ア   エ   ３．イ   ウ           ４．イ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":10,"body":"〔第10問〕（配点：２）契約の解除に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№10］）ア．債務者がその債務の全部の履行を拒絶する意思を明確に表示したときは、債権者は、その債務の履行期の前であっても、契約の解除をすることができる。イ．当事者の一方が相手方の債務不履行により契約を解除した場合は、その当事者は、相手方に対して金銭以外の物の返還義務を負うときであっても、その物を受領した時以後に生じた果実を相手方に返還する義務を負わない。ウ．期間の定めがなく、使用及び収益の目的の定めがある使用貸借の貸主は、借主がその目的に従い使用及び収益をするのに足りる期間を経過したときは、使用及び収益を終えていなくても、契約の解除をすることができる。エ．期間の定めのある動産の賃貸借の賃貸人は、やむを得ない事由があるときは、賃借人の損害を賠償して、契約の解除をすることができる。オ．請負人が仕事を完成しない間は、注文者は、いつでも損害を賠償して契約の解除をすることができる。","options":[["1","ア    ウ      ２．ア   エ   ３．イ   エ           ４．イ   オ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":11,"body":"〔第11問〕（配点：２）贈与に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№11］）ア．動産の贈与は、書面によらないものであっても、贈与者がある動産を無償で受贈者に与える意思を表示し、受贈者が受諾をすることによって、その効力を生ずる。イ．定期の給付を目的とする贈与は、贈与者又は受贈者のいずれかの死亡によって、その効力を失う。ウ．登記された建物が書面によらず贈与され、受贈者への所有権移転登記がされていても、引渡しが未了であれば、贈与者は贈与契約を解除することができる。エ．贈与者は、贈与の目的である動産の品質が契約の内容に適合しないことについて、その責任を負わない。オ．死因贈与は、遺言の方式によってしなければ、その効力を生じない。","options":[["1","ア    イ    ２．ア   エ   ３．イ   ウ           ４．ウ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"1"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":12,"body":"〔第12問〕（配点：２）請負に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№12］）ア．仕事の目的物の引渡しを要しない請負契約においては、請負人の仕事完成債務と注文者の報酬支払債務とは、同時履行の関係に立つ。イ．仕事の目的物の引渡しを要しない請負契約において、仕事の目的物が契約の内容に適合しない品質であったときは、注文者は、その仕事が完成した時から１年以内にその不適合の旨を通知しなければ、その不適合を理由として契約を解除することができない。ウ．請負人が注文者に引き渡した目的物が契約の内容に適合しない品質であった場合において、その不適合が注文者の提供した材料の性質に基づくものであるときは、請負人は、その材料が不適当であることを知りながら告げなかった場合であっても、請負人の担保責任を負わない。エ．注文者の責めに帰すべき事由によって仕事を完成できなくなった場合において、請負人が仕事完成債務を免れたことによって利益を得たときは、請負人は、その利益を注文者に償還する義務を負う。オ．請負人が仕事を完成する前に、注文者が破産手続開始の決定を受けたときは、請負人は、請負契約の解除をすることができる。","options":[["1","ア    ウ    ２．ア   エ   ３．イ   ウ           ４．イ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":13,"body":"〔第13問〕（配点：２）Ａの配偶者Ｂには兄Ｃ及び兄Ｄがおり、Ｄには配偶者Ｅがいる。この場合に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№13］）ア．家庭裁判所は、特別の事情があるときは、Ｄ及びＥの実子Ｆに対し、Ａを扶養する義務を負わせることができる。イ．ＡとＢが離婚したときは、ＡとＣとの親族関係は、姻族関係を終了させる旨のＡの意思表示により終了する。ウ．Ｄ及びＥの実子Ｇは、Ｃと婚姻をすることができない。エ．ＡとＢとの婚姻が重婚を理由に取り消し得るものであっても、Ｄは、その取消しを家庭裁判所に請求することはできない。オ．Ｄ及びＥがＨを養子とする普通養子縁組をした時に、Ｈに子Ｉがあったときは、Ｄ及びＥとＩとの間に親族関係が生じる。","options":[["1","ア    ウ   ２．ア    エ   ３．イ   ウ           ４．イ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"1"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":14,"body":"〔第14問〕（配点：２）遺言に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№14］）ア．遺言者が、ある権利について相続財産に属するかどうかにかかわらず遺贈の目的とした場合は、その権利が遺言者の死亡の時において相続財産に属しなかったときであっても、その遺贈は有効である。イ．負担付遺贈の受遺者が、その負担した義務を履行しない場合において、遺言者の相続人が相当の期間を定めて履行の催告をし、その期間内に履行がないときは、その相続人は、受遺者に対する意思表示によって、負担付遺贈に係る遺言を取り消すことができる。ウ．自筆証書遺言について、遺言書の検認がされた後は、遺言者の相続人は、その遺言の無効を主張することができない。エ．自筆証書遺言について、その証書中の加除その他の変更は、遺言者がその場所を指示し、これを変更した旨を付記して特にこれに署名し、かつ、その変更の場所に印を押さなければ、その効力を生じない。オ．疾病その他の事由によって死亡の危急に迫った者が、法定の人数の証人の立会いをもって、その一人に遺言の趣旨を口授する方式でした遺言は、法定の期間内に、証人の一人又は利害関係人から家庭裁判所に請求してその確認を得なければ、その効力を生じない。","options":[["1","ア    ウ   ２．ア    エ   ３．イ   ウ           ４．イ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"民法・商法・民事訴訟法","subject":"民法","number":15,"body":"〔第15問〕（配点：２）権利の消滅又は契約の終了に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№15］）ア．ＡのＢに対する貸金返還債務を保証したＣが、保証債務の履行として当該貸金返還債務の全額をＢに支払ったときは、当該貸金返還債務を被担保債務として設定されたＡ所有の土地を目的とする抵当権は、消滅する。イ．ＡがＢに対して絵画を売る旨の契約を締結した後に、目的物である絵画の滅失によりＡの目的物引渡債務が履行不能となったときは、ＢのＡに対する代金支払債務は、当然に消滅する。ウ．委任者の死亡によって委任が終了した場合において、急迫の事情があるときは、委任者の相続人が委任事務を処理することができるようになるまで、受任者は、必要な処分をする義務を負う。エ．ＡがＢに対して建物を賃貸する旨の契約を締結した後に、Ｂがその建物をＡから買い受けた場合には、ＡＢ間の賃貸借契約に基づく賃借権は、第三者の権利の目的となっている場合を除き、消滅する。オ．ＡがＢに対して自動車を賃貸する旨の契約を締結し、Ａの承諾を得てＢがＣに対しこれを転貸する旨の契約を締結した後に、ＡＢ間の契約が期間満了により終了したときは、ＢＣ間の契約は、遅くともＡがＣに対して自動車の返還を請求した時に終了する。","options":[["1","ア    イ    ２．ア   エ   ３．イ   ウ           ４．ウ   オ   ５．エ   オ第16問から第30問までの試験問題については、問題文に明記されている場合を除き、清算株式会社及び特例有限会社については考慮しないものとする。"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"1"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":16,"body":"〔第16問〕（配点：２）株式会社の発起設立に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№16］）ア．発起人は、株式会社の成立の時までに、発行可能株式総数を定款で定めなければならない。イ．発起人がその引き受けた設立時発行株式の出資に係る金銭の払込みを仮装した場合において、当該払込みの仮装に関与した発起人（当該払込みを仮装したものを除く。）は、その職務を行うについて注意を怠らなかったことを証明したときは、株式会社に対し、当該払込みを仮装した出資に係る金銭の支払をする義務を負わない。ウ．発起人は、その引き受けた設立時発行株式について、出資に係る金銭の払込期日又は払込期間を定めなければならない。エ．発起人は、設立時発行株式の出資に係る金銭の払込みの取扱いをした銀行に対し、当該出資の履行として払い込まれた金額に相当する金銭の保管に関する証明書の交付を請求することができる。オ．設立時取締役は、その選任後遅滞なく、出資の履行が完了していることを調査しなければならない。","options":[["1","ア    イ     ２．ア   エ   ３．イ   オ    ４．ウ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":17,"body":"〔第17問〕（配点：２）株式の譲渡に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。なお、各記述に係る株式会社の定款には、別段の定めがないものとする。（解答欄は、［№17］）ア．判例の趣旨によれば、株券発行会社において、遅滞なく株券が発行された場合には、株券の発行前にした株式の譲渡は、当該株券発行会社に対し、その効力を生じない。イ．子会社は、他の会社の事業の全部を譲り受ける場合には、当該他の会社の有する親会社株式を取得することができる。ウ．会社法上の公開会社である株券発行会社は、自己株式を処分した日以後遅滞なく、当該自己株式を取得した者に対し、株券を交付しなければならない。エ．譲渡制限株式を取得した株式取得者は、株式会社に対し、譲渡等承認請求をすることができない。オ．取締役会設置会社において、その譲渡制限株式の株主が譲渡等承認請求をするに当たって、当該取締役会設置会社が譲渡の承認をしない旨の決定をする場合には当該取締役会設置会社が当該譲渡制限株式を買い取ることを請求したときは、当該取締役会設置会社が対象株式を買い取る旨の決定は、株主総会の決議によることを要しない。","options":[["1","ア    イ     ２．ア   オ   ３．イ   ウ    ４．ウ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":18,"body":"〔第18問〕（配点：２）異なる種類の株式に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№18］）ア．株式会社は、剰余金の配当を受ける権利及び残余財産の分配を受ける権利のいずれも有しないことを内容とする種類の株式を発行することができる。イ．株式会社は、株主総会において決議をすることができる事項の全部について議決権を行使することができないことを内容とする種類の株式を発行することができる。ウ．株式会社は、株主総会において決議すべき事項のうち、当該決議のほか、当該種類の株式の種類株主を構成員とする種類株主総会の決議があることを必要とすることを内容とする種類の株式を発行することができる。エ．株式会社は、その発行する一部の種類の株式についてのみ譲渡制限株式とすることができる。オ．会社法上の公開会社は、当該種類の株式の株主が株主総会において１株につき複数個の議決権を有することを内容とする種類の株式を発行することができる。","options":[["1","ア    ウ   ２．ア   オ   ３．イ   ウ    ４．イ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":19,"body":"〔第19問〕（配点：２）新株予約権に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№19］）ア．株式会社は、自己の新株予約権を取得したときは、速やかに、これを処分しなければならない。イ．判例の趣旨によれば、会社法上の公開会社でない株式会社において、株主総会の特別決議によって新株予約権の行使条件の決定が取締役会に委任されている場合には、当該新株予約権の発行後にこれを変更することができる旨の明示の委任がなくとも、原則として、取締役会の決議に基づいて、当該新株予約権の行使条件を変更することができる。ウ．株式会社は、募集事項の決定をすることなく、自己新株予約権を譲渡することができる。エ．会社法上の公開会社でない取締役会設置会社において、株主に新株予約権の割当てを受ける権利を与える場合の募集事項の決定を取締役会の決議で行うことができる旨を定款で定めることはできない。オ．新株予約権の発行に金銭の払込みを要しないと定める場合であっても、当該新株予約権を引き受ける者に特に有利な条件でないことがある。","options":[["1","ア    エ   ２．ア   オ   ３．イ   ウ    ４．イ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":20,"body":"〔第20問〕（配点：２）株主総会に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№20］）ア．取締役が株主の全員に対して株主総会に報告すべき事項を通知した場合において、当該事項を株主総会に報告することを要しないことにつき株主の全員が書面又は電磁的記録により同意の意思表示をしたときは、当該事項の株主総会への報告を省略することができる。イ．取締役会設置会社でない株式会社において、株主総会を招集するに当たり、株主総会に出席しない株主が書面又は電磁的方法によって議決権を行使することができる旨を定めない場合には、株主総会の目的である事項を株主に対して通知することを要しない。ウ．取締役会設置会社の取締役が取締役会の決議を経て株主総会の目的である事項について提案をした場合において、当該提案につき株主（当該事項について議決権を行使することができるものに限る。）の過半数が書面又は電磁的記録により同意の意思表示をしたときは、当該提案を可決する旨の株主総会の決議があったものとみなされる。エ．株主総会に出席しない株主が書面によって議決権を行使することができる旨を定めた株主総会に関し、株主が議決権行使書面を事前に株式会社に送付した場合には、当該株主は、当該株主総会に出席して議決権を行使することができない。オ．株主総会における議決権の行使について、株主が第三者に議決権の代理行使をさせる内容の委任状を株式会社に事前に提出した場合には、当該株主は、当該株主総会の前であっても、これを撤回することができない。","options":[["1","ア    イ   ２．ア   エ   ３．イ   ウ    ４．ウ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"1"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":21,"body":"〔第21問〕（配点：２）監査役会設置会社及び監査等委員会設置会社に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。なお、各記述に係る株式会社の定款には、別段の定めがないものとする。（解答欄は、［№21］）ア．監査役及び監査等委員である取締役の任期は、いずれも、選任後４年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。イ．監査役は、いつでも、取締役に対して事業の報告を求めることができ、監査等委員会が選定する監査等委員は、いつでも、取締役に対してその職務の執行に関する事項の報告を求めることができる。ウ．株式会社が取締役（監査等委員を除く。）の責任を追及する訴えに係る訴訟における和解をするには、監査役会設置会社においては各監査役の同意を、監査等委員会設置会社においては各監査等委員の同意を得なければならない。エ．取締役は、監査役会設置会社において株主総会に監査役の選任に関する議案を提出するには各監査役の同意を、監査等委員会設置会社において株主総会に監査等委員である取締役の選任に関する議案を提出するには各監査等委員の同意を得なければならない。オ．取締役は、会計監査人の報酬を定める場合には、監査役会設置会社においては監査役会の同意を、監査等委員会設置会社においては監査等委員会の同意を得なければならない。","options":[["1","ア    イ   ２．ア   エ   ３．イ   ウ    ４．ウ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":22,"body":"〔第22問〕（配点：２）会社及びその利害関係人に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。なお、各記述に係る会社の定款には、別段の定めがないものとする。（解答欄は、［№22］）ア．判例の趣旨によれば、取締役会設置会社において、取締役が自己又は第三者のために当該取締役会設置会社と取引をしようとする場合には、当該取引が当該取締役会設置会社の事業の部類に属するか否かにかかわらず、原則として、取締役会の承認を受けなければならない。イ．株式会社において、株主でもある取締役がその任務を怠った場合における当該株式会社に対する損害賠償責任の一部免除について株主総会の決議をする場合には、当該取締役は、その決議について議決権を行使することができない。ウ．持分会社が訴えをもって当該持分会社の社員の除名を請求するには、当該社員以外の社員の全員の同意に基づかなければならない。エ．株式会社が特定の株主から当該株式会社の株式を取得することについて株主総会の決議を要する場合には、当該特定の株主は、その決議について議決権を行使することができる。オ．取締役会設置会社において、取締役と当該取締役会設置会社との取引について取締役会の承認を要する場合には、当該取締役は、その議決に加わることができない。","options":[["1","ア    ウ   ２．ア    オ   ３．イ   ウ    ４．イ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":23,"body":"〔第23問〕（配点：２）株式会社の計算書類等に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。なお、各記述に係る株式会社の定款には、電子提供措置をとる旨の定めがないものとする。（解答欄は、［№23］）ア．会計参与設置会社においては、会計参与は、取締役と共同して、事業報告及びその附属明細書を作成する。イ．取締役会設置会社においては、取締役は、定時株主総会の招集の通知に際して、株主に対し、計算書類及び事業報告を提供しなければならない。ウ．株式会社の親会社社員は、当該株式会社の営業時間内であれば、いつでも、当該株式会社の計算書類の閲覧を請求することができる。エ．取締役会設置会社においては、計算書類及び事業報告並びにこれらの附属明細書は、取締役会の承認を受けなければならない。オ．会計監査人設置会社（監査等委員会設置会社及び指名委員会等設置会社を除く。）においては、計算書類及び事業報告並びにこれらの附属明細書は、監査役及び会計監査人の監査を受けなければならない。","options":[["1","ア    イ   ２．ア    オ   ３．イ   エ    ４．ウ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":24,"body":"〔第24問〕（配点：２）持分会社に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。なお、各記述に係る持分会社の定款には、別段の定めがないものとし、また、持分会社の社員は２人以上あるものとする。（解答欄は、［№24］）ア．持分会社は、社員の３分の２以上の多数をもって、定款の変更をすることができる。イ．持分会社は、総社員の同意によって、解散する。ウ．持分会社の業務（常務を除く。）は、社員の過半数をもって決定する。エ．業務を執行する社員を定款で定めた場合には、各社員は、持分会社の業務を執行する権利を有しないときであっても、その業務及び財産の状況を調査することができる。オ．持分会社の清算において、当該持分会社の残余財産は、社員の数に応じて均等に分配される。","options":[["1","ア    ウ   ２．ア    オ   ３．イ   ウ    ４．イ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":25,"body":"〔第25問〕（配点：２）株式会社の組織再編等に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№25］）ア．吸収合併をする場合には、吸収合併存続会社及び吸収合併消滅会社のいずれにおいても債権者異議手続をしなければならない。イ．株式交換の対価として株式交換完全親会社の株式のみが交付される株式交換をする場合には、株式交換完全親会社において債権者異議手続をしなければならない。ウ．吸収分割をする場合には、当該吸収分割後に吸収分割会社に対して債務の履行を請求することができなくなる当該吸収分割会社の債権者は、当該吸収分割会社に対し、当該吸収分割について異議を述べることができる。エ．株式交付をする場合には、株式交付子会社において債権者異議手続をすることを要しない。オ．事業の全部の譲渡をする場合には、譲渡会社及び譲受会社のいずれにおいても債権者異議手続をしなければならない。","options":[["1","ア    イ   ２．ア    ウ   ３．イ   オ    ４．ウ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":26,"body":"〔第26問〕（配点：２）会社の組織についての訴えに関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№26］）ア．会社の新設分割の無効の訴えは、新設分割により設立する会社のみを被告として提起することができる。イ．株式会社の債権者は、新株発行の無効の訴えを提起することができない。ウ．新株発行を無効とする判決が確定した場合には、当該新株発行に係る株式は初めから発行されなかったものとして取り扱われる。エ．株主総会の決議の取消しの訴えにおいて、裁判所は、株主総会の決議の内容が法令又は定款に違反する場合であっても、その違反する事実が重大でないものであると認めるときは、裁量により請求を棄却することができる。オ．判例の趣旨によれば、会社法上の公開会社において、株主以外の者に対する特に有利な払込金額による新株発行に必要となる株主総会の特別決議を経ていないことは、当該新株発行の無効原因とならない。","options":[["1","ア    ウ   ２．ア    オ   ３．イ   エ    ４．イ   オ   ５．ウ   エ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":27,"body":"〔第27問〕（配点：２）商人及び商行為に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№27］）ア．農業を営む自然人は、生産した農作物を店舗で販売することを業としていても、商人とはみなされない。イ．判例の趣旨によれば、自然人が業として商行為を行うことを開始する前に行った行為であっても、その営業のためにする行為として商行為となることがある。ウ．小商人として商法の規定の一部の適用を免れるためには、登記が必要である。エ．いずれも商人でない自然人の間で行われた行為が商行為となることはない。オ．判例の趣旨によれば、株式会社がその代表取締役の友人に金銭を貸し付ける行為は、当該株式会社の事業のためにするものと推定される。","options":[["1","ア    イ   ２．ア   ウ   ３．イ   オ    ４．ウ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":28,"body":"〔第28問〕（配点：２）物品運送契約についての商法の規定に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№28］）ア．荷受人は、運送品の全部が滅失したときは、物品運送契約によって生じた荷送人の権利と同一の権利を取得する。イ．高価品について、荷送人が運送を委託するに当たり、その種類及び価額を運送人に通知しなかった場合において、運送人の故意又は重大な過失によって当該高価品が滅失したときは、運送人は債務不履行に基づく損害賠償責任を負う。ウ．荷受人は、運送品を受け取った場合であっても、運送人に対する運送賃の支払義務を負わない。エ．運送品の引渡しの当時、運送人が当該運送品に損傷があることを知っていた場合には、荷受人が異議をとどめないで当該運送品を受け取ったときであっても、これにより当該運送品の損傷についての運送人の債務不履行に基づく損害賠償責任は消滅しない。オ．荷送人は、運送人に対して運送の中止を請求することができない。","options":[["1","ア    イ   ２．ア   エ   ３．イ   オ    ４．ウ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":29,"body":"〔第29問〕（配点：２）寄託についての商法の規定に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№29］）ア．商人がその営業の範囲内において寄託を受けた場合であっても、報酬を受けないときは、善良な管理者の注意をもって寄託物を保管する義務を負わない。イ．倉庫営業者は、倉荷証券の記載が事実と異なる場合には、倉荷証券の所持人が悪意であるときであっても、これを当該所持人に対抗することができない。ウ．倉荷証券は、記名式である場合であっても、裏書を禁止する旨を記載したときでない限り、裏書によって譲渡することができる。エ．当事者が寄託物の保管期間を定めなかった場合には、やむを得ない事由がないときであっても、倉庫営業者は、当該寄託物の入庫後直ちに、その返還をすることができる。オ．倉荷証券が作成されたときは、これと引換えでなければ、寄託物の全部の返還を請求することができない。","options":[["1","ア    イ   ２．ア   オ   ３．イ   エ    ４．ウ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"民法・商法・民事訴訟法","subject":"商法","number":30,"body":"〔第30問〕（配点：２）約束手形及び小切手に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№30］）ア．約束手形の金額について文字と数字で異なる金額が記載されている場合には、最小の金額が手形金額となる。イ．約束手形が振り出された後に手形金額が変造された場合には、当該約束手形の振出人は、変造前の手形金額の限度で手形上の債務を負う。ウ．小切手は、持参人払式で振り出すことができない。エ．小切手は、振出人の自己宛てで振り出すことができない。オ．小切手の支払人は、銀行又は銀行と同視される人若しくは施設でなければならない。","options":[["1","ア    エ   ２．ア   オ   ３．イ   ウ    ４．イ   オ   ５．ウ   エ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":31,"body":"〔第31問〕（配点：２）次の【事例】を前提とし、当事者に関する次の１から５までの各記述のうち、判例の趣旨に照らし誤っているものを２個選びなさい。（解答欄は、［№31］、［№32］順不同）【事例】Ｘは、法人でない社団であり、団体運営の方法及び財産管理の方法について定めた規約を有しており、Ａを代表者と定めていた。Ｘは、Ｘの構成員でないＹを被告として、Ｙ名義で登記されている甲土地について、Ｘの構成員全員の総有に属することの確認を求める訴え（以下「本件訴え」という。）を提起した。","options":[["1","ＡがＸの代表者として本件訴えに係る訴訟を追行するためには、Ｘの規約等により甲土地を処分するのに必要とされる総会の議決等による授権が必要である。"],["2","本件訴えにおいて、Ｘに当事者能力が認められるためには、Ｘが固定資産ないし基本的財産を有していることが必要である。"],["3","【事例】とは異なり、Ｘの構成員らが原告となり甲土地がＸの構成員全員の総有に属することの確認を求める訴えを提起し、第一審裁判所が原告らの請求を認容し、控訴裁判所がＹの控訴を棄却し、Ｙが上告したところ、Ｘの構成員らの一部が当該訴えに係る訴訟の当事者となっていないことが判明した。この場合において、上告裁判所は、原判決を破棄し、第一審判決を取り消して、当該訴えを却下することができる。"],["4","【事例】とは異なり、ＸがＹを被告として、甲土地について、Ａの個人名義への所有権移転登記手続を求める訴えを提起する場合には、Ｘは、当該訴えの原告適格を有する。"],["5","本件訴えについて、Ｘの請求を棄却する判決が確定した後に、Ｘの構成員全員が原告となり甲土地についてＸの構成員全員の総有に属することの確認を求める訴え（以下「本件後訴」という。）を提起した場合には、本件後訴において、裁判所が、本件訴えの確定判決の既判力の基準時前にＸの構成員全員が甲土地の総有権を取得したことを理由に請求を認容する判決をすることは、本件訴えの確定判決の既判力に抵触しない。"]],"binary":false,"chooseTwo":true,"statements":[],"answer":"25"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":32,"body":"〔第32問〕（配点：２）共同訴訟に関する次の１から５までの各記述のうち、判例の趣旨に照らし正しいものはどれか。（解答欄は、［№33］）","options":[["1","Ｘが所有する土地上に建物を共有するＹ１及びＹ２を共同被告として、Ｘが建物収去土地明渡しを求める訴えを提起した場合において、Ｙ１及びＹ２に訴訟代理人がなく、これらの訴えに係る訴訟の係属中にＹ１が死亡したときは、当該訴訟手続は、Ｙ１及びＹ２のいずれについても中断する。"],["2","Ｘは、主債務者Ｙ１とその連帯保証人Ｙ２を共同被告として、Ｙ１に対して貸金の返還を求める訴えを、Ｙ２に対して保証債務の履行を求める訴えを提起した。これらの訴えに係る訴訟において、Ｙ１が既に当該貸金債権が時効により消滅したと主張した場合には、Ｙ２が何らの防御の方法も提出せず、Ｙ１がＹ２に補助参加していなくても、裁判所は、当該貸金債権の時効による消滅を基礎付ける事実が認められるとの心証に至ったときは、当該時効による消滅を理由として、ＸのＹ２に対する請求を棄却する旨の判決をすることができる。"],["3","Ｘは、強風により剥がれて飛ばされた建物の屋根の一部に当たり傷害を負ったと主張して、当該建物の所有者Ｙ１及びその占有者Ｙ２を共同被告として、土地の工作物の設置の瑕疵を理由とする損害賠償を請求する訴えを提起した。これらの訴えに係る訴訟の第一審において、Ｘが同時審判の申出をし、第一審裁判所がＹ１及びＹ２に対する請求をいずれも全て認容する判決をした場合において、Ｙ１が適法に控訴したときは、Ｙ２についても当該判決の確定が遮断される。"],["4","Ｘは、Ｙ１の運転する自動車に同乗していたところ、Ｙ２の運転する自動車との間の交通事故により傷害を負ったと主張して、Ｙ１及びＹ２を共同被告として、不法行為に基づく損害賠償を請求する訴えを提起した。これらの訴えに係る訴訟において、裁判所が、Ｙ１が提出した証拠により、Ｙ２が主張しているＹ２に有利な事実を認定するには、Ｙ２からも証拠申出をしなければならない。"],["5","土地を共有するＸ１、Ｘ２及びＸ３が、当該土地の登記名義人であるＹを被告として、当該土地がＸ１、Ｘ２及びＸ３の共有に属することの確認を求めて訴えを提起した場合において、Ｘ１及びＸ２が訴えの取下げをし、Ｙがこれらの取下げに同意したときに、Ｘ３が訴えの取下げをしていなければ、当該Ｘ１及びＸ２の訴えの取下げは効力を生じない。"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":33,"body":"〔第33問〕（配点：２）訴訟参加に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№34］）ア．当事者が補助参加の申出について異議を述べた場合において、補助参加を許す旨の裁判が確定するまでの間は、補助参加人は、訴訟行為をすることができない。イ．補助参加人は、被参加人が再審の訴えを提起することができる場合においても、再審の訴えを提起することができない。ウ．補助参加人は、被参加人が口頭弁論の期日に欠席した場合においても、当該口頭弁論の期日において、訴訟行為をすることができる。エ．訴訟の係属中、適法に訴訟告知を受けた者は、当該訴訟に参加することができる第三者に対し、更に訴訟告知をすることができる。オ．第一審において補助参加をした補助参加人は、その控訴審において、改めて補助参加の申出をしなくても、訴訟行為をすることができる。","options":[["1","ア    イ     ２．ア   エ   ３．イ   ウ    ４．ウ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"1"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":34,"body":"〔第34問〕（配点：２）Ｘは、Ｙに対し、１０００万円を貸し付けたと主張し（以下、Ｘ主張の貸付けに係る貸金返還請求権を「甲債権」という。）、一部請求であることを明示して、消費貸借契約に基づく貸金返還請求として７００万円の支払を求める訴えを提起した。これに対し、Ｙは、請求棄却の判決を求め、当該貸付けの事実を否認するとともに、Ｘに対して７００万円の不当利得返還請求権を有しているとして（以下、Ｙ主張の不当利得返還請求権を「乙債権」という。）、これを自働債権とする相殺の抗弁を主張した。この事例に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№35］）ア．裁判所は、甲債権の額が１０００万円であり、乙債権の額が７００万円であると認定した上で、甲債権及び乙債権が相殺により対当額で消滅し、乙債権は消滅し、甲債権の残存額が３００万円であるとして、Ｘの請求について、３００万円の支払を求める限度で認容し、その余の請求を棄却する判決をし、同判決は、確定した。この場合において、甲債権に関しては、３００万円の存在及び７００万円の不存在について既判力が生ずる。イ．裁判所は、甲債権の額が１０００万円であり、乙債権の額が７００万円であると認定した上で、甲債権及び乙債権が相殺により対当額で消滅し、乙債権は消滅し、甲債権の残存額が３００万円であるとして、Ｘの請求について、３００万円の支払を求める限度で認容し、その余の請求を棄却する判決をし、同判決は、確定した。この場合において、乙債権に関しては、７００万円の不存在について既判力が生ずる。ウ．裁判所は、甲債権の額が１０００万円であり、乙債権の額が３００万円であると認定した上で、甲債権及び乙債権が相殺により対当額で消滅し、乙債権は消滅し、甲債権の残存額が７００万円であるとして、Ｘの請求を全部認容する判決をし、同判決は、確定した。この場合において、甲債権に関しては、７００万円の存在について既判力が生ずる。エ．裁判所は、甲債権の額が１０００万円であり、乙債権の額が３００万円であると認定した上で、甲債権及び乙債権が相殺により対当額で消滅し、乙債権は消滅し、甲債権の残存額が７００万円であるとして、Ｘの請求を全部認容する判決をし、同判決は、確定した。この場合において、乙債権に関しては、既判力が生じない。オ．裁判所は、甲債権の額が７００万円であり、乙債権の額が３００万円であると認定した上で、甲債権及び乙債権が相殺により対当額で消滅し、乙債権は消滅し、甲債権の残存額は４００万円であるとして、Ｘの請求について、４００万円の支払を求める限度で認容し、その余の請求を棄却する判決をし、同判決は、確定した。この場合において、乙債権に関しては、７００万円の不存在について既判力が生ずる。","options":[["1","ア    エ   ２．ア   オ   ３．イ   ウ    ４．イ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":35,"body":"〔第35問〕（配点：２）決定に関するアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№36］）ア．当事者は、決定で完結すべき事件について、裁判所において、口頭弁論をしなければならない。イ．訴訟の指揮に関する決定は、いつでも取り消すことができる。ウ．地方裁判所の裁判所書記官の処分に対する異議の申立てについては、その地方裁判所の直近上級の高等裁判所が、決定で、裁判をする。エ．決定は、相当と認める方法で告知することによって、その効力を生ずる。オ．決定により裁判をすることができない事項について決定がされたときは、これに対して抗告をすることができる。","options":[["1","ア    ウ   ２．ア   オ   ３．イ   ウ    ４．イ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"1"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":36,"body":"〔第36問〕（配点：２）弁論主義に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№37］）ア．Ｘは、甲土地につき、ＡがＢから買い受け、Ａの死亡によりＸが相続したと主張して、登記名義人であるＹに対し、所有権に基づき所有権移転登記手続を求める訴えを提起し、これに対し、Ｙは、甲土地につき、ＹがＢから買い受けたものであると主張し、Ｘ及びＹは、その他の主張をしなかった。この場合において、裁判所が、甲土地につき、ＡがＢから買い受けた後にＹに死因贈与したとの事実を認定し、Ｘの請求を棄却する判決をすることは、弁論主義に反する。イ．Ｘは、甲土地につき、登記名義人であるＹに対し、所有権に基づき所有権移転登記手続を求める訴えを提起し、これに対し、Ｙは、抗弁として、ＸがＡに対し代物弁済により甲土地を譲渡したと主張し、Ｘ及びＹは、その他の主張をしなかった。この場合において、裁判所が、ＸからＡへの代物弁済による甲土地の譲渡の事実を認定した上で、さらに、その後、ＸがＡから甲土地を買い戻したことを認定して、Ｘの請求を認容する判決をすることは、弁論主義に反する。ウ．Ｘは、甲土地につき、Ａから買い受けたと主張して、登記名義人であるＹに対し、所有権に基づき所有権移転登記手続を求める訴えを提起し、これに対し、Ｙは、ＡＸ間の売買契約が公序良俗に反し無効であるとの主張をしていなかったが、それを基礎付ける事実を主張していた。この場合において、裁判所が、公序良俗違反を基礎付ける事実を認定した上で、ＡＸ間の売買契約が公序良俗に反し無効であると判断して、Ｘの請求を棄却する判決をすることは、弁論主義に反する。エ．Ｘは、甲建物につき、Ｘが甲建物を建築してその所有権を取得したと主張して、Ｙに対し、その所有権の確認を求める訴えを提起し、Ｙは、Ｘによる甲建物の所有権取得の事実を否認し、その理由として、甲建物を建築してその所有権を取得したのはＡであると主張し、また、Ａが死亡し、Ａの子であるＸ及びＹがＡを相続したことも主張していた。この場合において、Ｘが、Ａが甲建物の所有権を取得したとの事実を自己の利益に援用していなかったときに、裁判所が、Ａが甲建物を建築してその所有権を取得したことを認定した上で、Ｘ及びＹが相続により甲建物の共有持分権をそれぞれ取得したと判断して、当該共有持分権の確認を求める限度でＸの請求を認容する判決をすることは、弁論主義に反しない。オ．Ｘは、甲土地につき、Ａから買い受けたと主張して、登記名義人であるＹに対し、所有権に基づき所有権移転登記手続を求める訴えを提起し、これに対し、Ｙは、ＡＸ間の甲土地の売買の事実を否認した。この場合において、裁判所が、Ａから甲土地を買い受けたのはＸではなくＸの妻のＢであるという、ＸもＹも主張していない事実を認定し、その結果、Ｘが主張するＸがＡから甲土地を買い受けたとの事実は認められないと判断して、Ｘの請求を棄却する判決をすることは、弁論主義に反する。","options":[["1","ア    イ   ２．ア   エ   ３．イ   ウ    ４．ウ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":37,"body":"〔第37問〕（配点：２）口頭弁論に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№38］）ア．裁判所は、当事者が終結した口頭弁論の再開を申請したときは、その申請について裁判をしなければならない。イ．裁判所は、訴訟要件についての争点と本案についての争点がある場合には、訴訟要件についての争点に審理を集中するために、口頭弁論を制限することができる。ウ．裁判所は、口頭弁論を併合するときは、当事者の意見を聴かなければならない。エ．主債務者とその連帯保証人を共同被告として訴えが提起された場合に、裁判所は、連帯保証人に対する訴えにつき口頭弁論を分離して判決することができる。オ．口頭弁論は、裁判長が指揮する。","options":[["1","ア    ウ    ２．ア   オ   ３．イ   エ    ４．イ   オ   ５．ウ   エ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"1"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":38,"body":"〔第38問〕（配点：２）争点及び証拠の整理手続に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№39］）ア．裁判所は、事件を書面による準備手続に付する場合には、当事者の意見を聴かなければならない。イ．準備的口頭弁論の結果は、準備的口頭弁論を終了した後の口頭弁論において当事者が陳述しなければ、訴訟資料とならない。ウ．裁判所は、当事者双方が弁論準備手続の期日に出頭しない場合であっても、相当と認めるときは、裁判所及び当事者双方が音声の送受信により同時に通話をすることができる方法によって、当該期日における手続を行うことができる。エ．裁判所は、準備的口頭弁論の期日において、証人尋問を行うことができる。オ．裁判所は、弁論準備手続の期日における傍聴に関し、当事者の一方が申し出た者について、相手方当事者が異議を述べた場合には、その傍聴を許すことができない。","options":[["1","ア    エ    ２．ア   オ   ３．イ   ウ    ４．イ   オ   ５．ウ   エ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":39,"body":"〔第39問〕（配点：２）証明に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№40］）ア．ある主要事実について証明責任を負わない当事者による立証は、当該主要事実の存在について裁判官に真偽不明の心証を抱かせれば足りる。イ．文書提出命令の申立てをした当事者は、文書の所持者として表示した者が当該文書を所持していることを証明しなければならない。ウ．損害の性質上その額を立証することが極めて困難であり、損害額の立証がされていない場合においては、損害が生じたことが認められるときであっても、裁判所は、相当な損害額を認定することはできない。エ．ある法律効果を発生させる主要事実とは別個の前提事実の存在が証明されれば、当該主要事実の存在が推定されるという法律上の事実推定に関して、当該主要事実につき証明責任を負う当事者が当該前提事実を証明し、相手方当事者が当該前提事実の存在について反証できない場合には、相手方当事者は、当該事実推定を覆すために、当該主要事実の不存在を証明しなければならない。オ．適法な占有の権原を基礎付ける複数の権利がある場合において、当該各権利を発生させる事実とは別個の前提事実の存在が証明されれば、適法な占有の権原が推定されるという法律上の権利推定に関して、当該各権利を発生させる事実につき証明責任を負う当事者が当該前提事実を証明し、相手方当事者が当該前提事実の存在について反証できない場合には、相手方当事者は、当該各権利のうち一つにつき権利を発生させる事実が存在しないことを証明すれば、当該権利推定を覆すことができる。","options":[["1","ア    イ   ２．ア   エ   ３．イ   オ    ４．ウ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":40,"body":"〔第40問〕（配点：２）証拠の申出に関する次のアからオまでの各記述のうち、正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№41］）ア．証拠の申出は、弁論準備手続の終結後には、することができない。イ．証人尋問の申出は、口頭弁論の期日又は弁論準備手続の期日においてしなければならない。ウ．証拠の申出は、証明すべき事実を特定してしなければならない。エ．裁判所は、当事者が申し出た証拠が唯一の証拠方法に当たらない場合において、必要でないと認めるときには、当該証拠を取り調べることを要しない。オ．当事者本人の尋問は、当事者のいずれからも申出がない場合には、行うことができない。","options":[["1","ア    イ   ２．ア   エ   ３．イ   オ    ４．ウ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":41,"body":"〔第41問〕（配点：２）証拠に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№42］）ア．鑑定に必要な学識経験を有する者は、鑑定人となることができない場合を除き、鑑定をする義務を負う。イ．裁判所は、相当と認めるときであっても、裁判所外において証拠調べをすることはできない。ウ．疎明は、即時に取り調べることができる証拠によってしなければならない。エ．当事者が未成年である場合においては、その当事者本人の尋問を行うことはできない。オ．裁判所は、個人に対して、調査の嘱託をすることはできない。","options":[["1","ア    イ   ２．ア   ウ   ３．イ   エ    ４．ウ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":42,"body":"〔第42問〕（配点：２）処分権主義に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№43］）ア．原告が、事故により傷害を受けて被った損害について、不法行為による損害賠償請求権に基づき、被告に対し、休業損害５００万円及び慰謝料５００万円の合計１０００万円の支払を求めて訴えを提起した場合において、裁判所は、休業損害を３００万円の限度で認め、慰謝料を７００万円認めるのが相当であると判断したときには、原告の請求を全部認容する判決をすることができる。イ．原告が、ある債務につき、３００万円を超える債務の不存在の確認を求める訴えを提起した場合において、裁判所は、５００万円の債務が存在すると認めたときには、原告の請求を全部棄却する判決をすることができる。ウ．共有物分割の訴えにおいて、原告が分割方法として現物分割を求めている場合には、裁判所は、現物分割により著しく当該共有物の価格を減少させるおそれがあるときであっても、当該共有物を現物分割する旨の判決をしなければならない。エ．建物の賃貸人である原告が、賃借人である被告に対し、賃貸借契約の終了に基づき、３００万円の立退料の支払と引換えに当該建物を明け渡すことを求めて訴えを提起した場合において、裁判所は、被告に対し、３５０万円の立退料の支払と引換えに当該建物を明け渡すことを命じる判決をすることはできない。オ．筆界確定訴訟において、裁判所は、原告が主張する筆界よりも、原告に有利な筆界を定める判決をすることができる。","options":[["1","ア    エ   ２．ア   オ   ３．イ   ウ    ４．イ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":43,"body":"〔第43問〕（配点：２）請求の放棄又は認諾に関する次のアからオまでの各記述のうち、判例の趣旨に照らし誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№44］）ア．請求の放棄は、和解の期日においてすることができない。イ．請求の放棄は、請求の目的が可分である場合には、その一部についてすることができる。ウ．請求の認諾をする旨の書面を提出した当事者が口頭弁論の期日に出頭しないときは、裁判所は、その旨の陳述をしたものとみなすことができる。エ．請求の認諾は、訴えが不適法である場合においても、することができる。オ．請求の認諾を調書に記載したときは、その記載は、確定判決と同一の効力を有する。","options":[["1","ア    ウ   ２．ア   エ   ３．イ   エ    ４．イ   オ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":44,"body":"〔第44問〕（配点：２）訴訟上の和解に関する次のアからオまでの各記述のうち、判例の趣旨に照らし正しいものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№45］）ア．委任による訴訟代理人は、特別の委任を受けていない場合にも、訴訟上の和解をすることができる。イ．裁判所は、訴訟の係属中、口頭弁論の終結後においても和解を試みることができる。ウ．訴訟上の和解が成立したことによって訴訟が終了した旨を宣言した判決は、当該和解が有効であることについて既判力を有する。エ．当事者双方が、裁判所が定める和解条項に服する旨を記載した書面で共同の申立てをし、裁判所が、適当な和解条項を定めた場合において、当該和解条項の定めが当事者双方に告知されたときは、当事者間に和解が調ったものとみなされる。オ．当事者の一方が、訴訟上の和解の内容である私法上の契約につき、債務不履行を理由に解除した場合には、当該和解により終了した訴訟は、復活する。","options":[["1","ア    ウ     ２．ア   エ   ３．イ   エ    ４．イ   オ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"民法・商法・民事訴訟法","subject":"民事訴訟法","number":45,"body":"〔第45問〕（配点：２）再審に関する次のアからオまでの各記述のうち、誤っているものを組み合わせたものは、後記１から５までのうちどれか。（解答欄は、［№46］）ア．再審の訴えは、不服の申立てに係る判決の確定前においても、提起することができる。イ．控訴されずに確定した第一審判決に対する再審の訴えは、当該判決をした裁判所の管轄に専属する。ウ．再審の訴えを提起した当事者は、不服の理由を変更することができる。エ．裁判所が再審の事由がないとして、再審の請求を棄却する決定をした場合において、当該決定が確定したときは、同一の事由を不服の理由として、更に再審の訴えを提起することができない。オ．裁判所が再審開始の決定をする場合において、相手方の審尋は、不要である。","options":[["1","ア    イ     ２．ア   オ   ３．イ   ウ    ４．ウ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":1,"body":"〔第１問〕（配点：２）不作為犯に関するアからオまでの各記述のうち、誤っているものを全て選んだ場合の組合せは１から５までのうちどれか。（解答欄は、［No.１］）ア．真正不作為犯と不真正不作為犯との違いは、刑罰法規そのものが構成要件要素として明文で不作為を規定しているか否かにある。イ．作為義務を不真正不作為犯の成立要件とすることにより、結果の発生を回避し得る作為をしなかった複数の者の中から不作為犯の主体となり得ない者を除外することができる。ウ．不作為犯は、結果発生を防止しなければならない義務が法律上の規定に基づくものでなければ、成立しない。エ．不真正不作為犯は、殺人罪や放火罪については成立するが、財産犯については成立しない。オ．判例の立場によれば、不作為による放火罪が成立するためには、既発の火力を利用する意思が必要である。","options":[["1","ア    イ     ２．イ   ウ   ３．イ   ウ    エ      ４．ウ   エ   ５．ウ   エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":2,"body":"〔第２問〕（配点：３）１から５までの各記述を判例の立場に従って検討した場合、誤っているものを２個選びなさい。（解答欄は、［No.２］、［No.３］順不同）","options":[["1","タクシー運転手である甲が、警察官から自動車運転免許証の提示を求められれば提示するつもりで、偽造された自動車運転免許証を携帯して自動車の運転を開始した場合、それだけでは甲に偽造公文書行使罪は成立しない。"],["2","甲が、身分証明に使おうと考え、Ａ県公安委員会が発行したＸの自動車運転免許証に貼付されている写真を甲自身のものに貼り替え、生年月日欄も甲自身のものに改ざんした場合、甲に公文書偽造罪は成立せず、公文書変造罪が成立する。"],["3","学校法人Ｘの理事である甲が、Ｘの理事会議事録についてその作成権限が付与されていなかったにもかかわらず、行使の目的で、Ｘの理事会議事録に、自己を理事長に選任し、かつ、自己を議事録署名人とすることを可決したなどと虚偽の内容を記載し、その末尾に「Ｘ理事会議事録署名人甲」と記載した場合、甲に私文書偽造罪が成立する。"],["4","指名手配中の甲が、素性が明らかになることを免れるため、偽名を用いて就職しようと考え、行使の目的で、氏名欄に偽名であるＸと記載した上、真実と異なる生年月日、住所及び経歴を記載した履歴書を作成し、その顔写真欄に甲の顔写真を貼付した場合、甲に私文書偽造罪が成立する。"],["5","本邦に密入国した甲が、外国人の新規登録申請をしていないにもかかわらず、Ｘ名義で発行された外国人登録証明書を他から取得し、Ｘ名義で登録事項確認申請を繰り返すことにより、自らが外国人登録証明書のＸその人であるかのように装って本邦に在留を続け、Ｘという名称を永年自己の氏名として公然使用した結果、それが相当広範囲に甲を指称するものとして定着していた状況において、行使の目的で、Ｘ名義の再入国許可申請書を作成した場合、甲に私文書偽造罪は成立しない。"]],"binary":false,"chooseTwo":true,"statements":[],"answer":"25"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":3,"body":"〔第３問〕（配点：２）学生Ａ及びＢは、【事例】について、【会話】のとおり議論している。【会話】中の①から⑦までの（     ）内に【語句群】から適切なものを入れた場合、正しいものの組合せは１から５までのうちどれか。なお、①から⑦までの（       ）内には、それぞれ異なるものが入る。（解答欄は、［No.４］）【事     例】甲は、自動車を運転していた際、前方不注視のため、進路前方の横断歩道を歩いていたＸに気付くのが遅れ、ブレーキを踏もうとしたが、誤ってアクセルを踏んでしまい、自車をＸに衝突させ、Ｘに重傷を負わせた。【会     話】学生Ａ．私は、過失犯の実行行為について、（①）と考えます。学生Ｂ．そのように考えるのはなぜですか。学生Ａ．私のように考えないと、（②）まで実行行為とされるおそれがあり、（③）からです。学生Ｂ．私は、Ａさんとは異なり、（④）と考えます。Ａさんの見解では、この【事例】の場合、（⑤）だけが実行行為となりますが、私の見解では（⑤）と（⑥）の双方が実行行為となります。学生Ａ．（⑤）が実行行為になるという点では同じなのですから、私の見解もＢさんの見解も実質的な結論に違いはないのではないですか。学生Ｂ．例えば、（⑦）には、Ａさんの見解よりも私の見解の方が過失をより適切に認定することができると思います。【語句群】ａ．結果発生に直近する不注意な行為だけが過失犯の実行行為となるｂ．発生した結果と因果関係のある不注意な行為は全て過失犯の実行行為になり得るｃ．結果発生と関連が薄い間接的な落ち度ｄ．発生した結果との因果関係が認められない行為ｅ．公判審理の争点が不明確になる         ｆ．過失の共同正犯を認めることができなくなるｇ．前方不注視         ｈ．ブレーキとアクセルの操作の誤りｉ．ブレーキとアクセルの操作の誤りが主たる原因である場合ｊ．前方不注視が主たる原因である場合","options":[["1","①ａ    ③ｆ   ⑥ｇ"],["2","①ｂ    ④ａ   ⑥ｈ"],["3","②ｃ    ④ｂ   ⑦ｉ"],["4","②ｄ    ⑤ｇ   ⑦ｊ"],["5","③ｅ    ⑤ｈ   ⑦ｊ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":4,"body":"〔第４問〕（配点：３）１から５までの各記述は、甲の占有する動産を窃取した疑いで警察官の取調べを受けた被疑者の供述であるが、これらを判例の立場に従って検討した場合、その供述の内容が窃盗罪の成立を否定する主張となるものを２個選びなさい。（解答欄は、［No.５］、［No.６］順不同）","options":[["1","「この自転車は、駅前の有料駐輪場に駐輪されていたが、自宅まで歩いて帰るのが面倒だったので、自宅近くで乗り捨てようと考えて、自宅まで約３０分の道のりを乗って帰った。」"],["2","「この自動車は、駐車場にエンジンキーが付いた状態で駐車されていたのを見付け、半日くらいしたら元の場所に戻すつもりで、駐車場から発進させ、Ⅹ市内を乗り回していた。」"],["3","「この社員証は、上司である甲が会社で保管していたものであることを知っていたが、甲を困らせて日頃のうっぷんを晴らそうと思い、会社の自分のロッカー内に隠しておいた。」"],["4","「この自転車は、甲に貸していたものだが、返却期限が過ぎているのに甲が返してくれないので、深夜、甲がいない隙に甲の自宅敷地内にある車庫のシャッターを壊し、そこに駐輪されていたところを、甲に無断で持ち帰った。」"],["5","「この自転車は、雑草の生い茂った空き地に捨ててあり、誰の物でもないと思ったので、通勤で使うために自宅に持ち帰った。」"]],"binary":false,"chooseTwo":true,"statements":[],"answer":"35"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":5,"body":"〔第５問〕（配点：２）学生Ａ及びＢは、【事例】について、【会話】のとおり議論している。【会話】中の①から⑦までの（     ）内に【語句群】から適切なものを入れた場合、正しいものの組合せは１から５までのうちどれか。なお、①から⑦までの（           ）内には、それぞれ異なるものが入る。（解答欄は、［No.７］）【事     例】甲は、実際にはＸが甲に殴りかかってきてはいないのに、Ｘが素手で甲に殴りかかってきたものと誤信し、自己の身を守る意思で、近くにあった金属バットでＸを殴打して重傷を負わせた。甲の殴打行為は、仮にＸが本当に甲に素手で殴りかかってきていたとしても、それに対する防衛手段としての相当性を逸脱していた。甲は、金属バットでＸを殴打している事実について認識していた。【会     話】学生Ａ．まず、【事例】を考える前提として、急迫不正の侵害がないのにあると誤信した場合について、あなたはどう考えますか。学生Ｂ．その場合、（①）が問題となり、違法性阻却事由を基礎付ける事実の存在について誤信しているので事実の錯誤であり、（②）が阻却され、誤信したことについて（③）があったと認められれば、（④）と考えます。学生Ａ．では、【事例】の場合にも、甲に（④）と考えるのですか。学生Ｂ．いいえ。私は、判例と同じ立場を採り、甲に（⑤）罪が成立すると考えます。学生Ａ．あなたは、なぜそのように考えるのですか。学生Ｂ．【事例】では、甲は、素手で殴りかかってきたＸを金属バットで殴るということを認識しているところ、（⑥）からです。学生Ａ．【事例】で、刑法第３６条第２項が適用又は準用されるかについてどう考えますか。学生Ｂ．私は、判例同様、（⑦）と考えます。【語句群】ａ．誤想防衛          ｂ．過剰防衛     ｃ．違法性    ｄ．故意   ｅ．過失ｆ．やむを得ない事由           ｇ．故意犯が成立する     ｈ．過失犯が成立するｉ．傷害        ｊ．過失傷害ｋ．違法性阻却事由の錯誤は故意を阻却しないので、過剰事実についての認識の有無にかかわらず故意犯が認められるｌ．急迫不正の侵害の誤信がなければ過剰な防衛行為もなかったであろうから、急迫不正の侵害の誤信の点が行為全体について支配力を持ち、行為を全体的に把握すると過失犯的性格を持つｍ．過剰事実についての認識がある場合には行為者の認識内容は過剰防衛であり、違法性を基礎付ける事実についての認識があるため故意犯が認められるｎ．刑法第３６条第２項によって刑が減免され得るｏ．刑法第３６条第２項の適用も準用もされない","options":[["1","①ａ    ②ｄ   ④ｈ   ⑥ｋ"],["2","①ａ    ③ｅ   ⑤ｉ   ⑦ｎ"],["3","①ｂ    ③ｅ   ④ｇ   ⑥ｍ"],["4","②ｃ    ③ｆ   ⑤ｊ   ⑥ｌ"],["5","②ｄ    ④ｈ   ⑤ｉ   ⑦ｏ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":6,"body":"〔第６問〕（配点：２）アからオまでの各記述を判例の立場に従って検討した場合、正しいものの組合せは１から５までのうちどれか。（解答欄は、［No.８］）ア．信用毀損罪は、経済的な側面における人の社会的な評価を保護するものであり、同罪における「信用」には、人の支払能力又は支払意思に対する社会的な信頼は含まれるが、扱う商品の品質に対する社会的な信頼は含まれないので、コンビニエンスストアで粗悪な商品を販売しているという虚偽の風説を流布した行為は、信用毀損行為に該当しない。イ．威力業務妨害罪における「威力」とは、人の意思を制圧するに足りる勢力を示すことであり、被害者が執務のために日頃使っている机の引き出し内に、猫の死骸をひそかに入れておき、被害者にこれを発見させ、畏怖させるに足りる状態におく行為は、威力に該当する。ウ．偽計業務妨害罪における「偽計」とは、人を欺罔し、あるいは人の錯誤又は不知を利用することをいい、電話料金の支払を免れるための機器を電話回線に取り付けて課金装置の作動を不能にする行為は、偽計に該当しない。エ．信用毀損罪における「虚偽の風説を流布」とは、客観的真実に反する事項を不特定又は多数の人に伝播させることをいうが、実際に破産した者について、その者が破産者である旨記載されたビラを多数人に配布した行為であっても、虚偽の風説の流布に該当する。オ．業務妨害罪における「妨害」とは、現に業務妨害の結果が発生したことを必要とせず、業務を妨害するおそれがある行為が行われれば足りるので、美容師を解雇させて美容室経営者の業務を妨害するため、同経営者宛てに同美容師の技量に関する虚偽内容の信書を郵送した行為は、その結果として同美容師の解雇には至らなくとも、妨害行為に該当し得る。","options":[["1","ア    ウ   ２．ア   エ   ３．イ   ウ           ４．イ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":7,"body":"〔第７問〕（配点：２）原因において自由な行為に関する各【見解】に従って各【事例】における甲の罪責を検討した場合、１から５までの各【記述】のうち、誤っているものはどれか。（解答欄は、［No.９］）【見     解】Ａ説：責任能力がある状態で行われた、責任無能力状態の自分を道具として利用しようとする原因行為を、構成要件該当行為と捉えるが、限定責任能力状態の自分については道具とは捉えない。Ｂ説：責任無能力状態あるいは限定責任能力状態で行われた結果行為を構成要件該当行為と捉えつつ、責任能力は意思決定時に存在すれば足りる。【事     例】Ⅰ．甲は、心神喪失状態の自分を道具として利用してＸを殺害することを意図し、Ｘ宅に赴く前に多量に飲酒してＸ宅に赴き、心神喪失状態でＸを殺害した。Ⅱ．甲は、Ｘを殺害することを意図し、心神耗弱状態に陥る可能性があることを認識しつつ、Ｘ宅に赴く前に多量に飲酒してＸ宅に赴き、心神耗弱状態でＸを殺害した。Ⅲ．甲は、Ｘを殺害することを意図し、心神喪失状態に陥る可能性があることを認識しつつ、Ｘ宅に赴く前に多量に飲酒したが、酔いつぶれて眠ってしまい、Ｘ宅に赴くことができずＸの殺害に及ばなかった。Ⅳ．甲は、酒に酔うと他人に危害を加えることがある性癖があることを自覚していたが、今回は酔わないだろうと軽信して飲酒したところ、心神喪失状態に陥った際にＸと口論になり、Ｘに対する殺意が生じ、Ｘを殺害した。Ⅴ．甲は、酒に酔うと他人に危害を加えることがある性癖があることを自覚していたが、今回は酔わないだろうと軽信して飲酒したところ、心神耗弱状態に陥った際にＸと口論になり、Ｘに対する殺意が生じ、Ｘを殺害した。【記    述】","options":[["1","Ａ説によれば、事例Ⅰ及び事例Ⅱのいずれも、甲にＸに対する殺人既遂罪が成立し得るが、事例Ⅱでは、刑法第３９条第２項が適用されて刑が減軽される。"],["2","Ｂ説によれば、事例Ⅰでは、甲にＸに対する殺人既遂罪が成立し得るが、事例Ⅲでは、甲にＸに対する殺人未遂罪は成立しない。"],["3","Ｂ説によれば、事例Ⅱでは、甲にＸに対する殺人既遂罪が成立し得るが、刑法第３９条第２項が適用されて刑が減軽される。"],["4","Ａ説によれば、事例Ⅳでは、甲にＸに対する殺人既遂罪は成立しないが、過失致死罪が成立し得る。"],["5","Ｂ説によれば、事例Ｖでは、甲にＸに対する殺人既遂罪が成立し得るが、刑法第３９条第２項が適用されて刑が減軽される。"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":8,"body":"〔第８問〕（配点：２）アからオまでの各記述を判例の立場に従って検討した場合、正しいものの組合せは１から５までのうちどれか。（解答欄は、［No.10］）ア．日本国民ではない甲が、日本国外である某国において、日本国民であるＡを殺害した場合、甲に刑法第１９９条が適用されることはない。イ．日本国外で幇助行為をした者であっても、正犯が日本国内で実行行為をした場合には、刑法第１条第１項の「日本国内において罪を犯した」者に当たるから、日本国民ではない甲が、日本国民である乙が日本国内でＡを殺害するために使うことを知りながら、日本国外である某国のホテル内で、乙にナイフを貸与し、その後、乙が日本国内でそのナイフを使用してＡを殺害した場合、甲に刑法が適用される。ウ．ある刑罰法規について、法律の文言上可能な範囲で、当該法規の趣旨を考慮して、日常的意味よりも拡張して解釈することは許されないので、過失往来危険罪（刑法第１２９条）にいう「汽車」にガソリンカー（蒸気機関車の代用であるガソリン動力の鉄道車両）も含まれると解釈することは許されない。エ．犯罪と刑罰は、「法律」によって定められていなければならないところ、この「法律」には、法律の委任を受けた政令、条例及び慣習法が含まれる。オ．行為時に適法であった行為をその後の法律によって遡って処罰したり、行為時にも犯罪であるがその後の法律によって法定刑が重く変更された場合に変更後の重い法定刑で処罰したりすることは許されないが、その後の法律によって法定刑が軽く変更された場合に変更後の軽い法定刑で処罰することは許される。","options":[["1","ア イ   ２．ア エ     ３．イ オ           ４．ウ エ   ５．ウ オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":9,"body":"〔第９問〕（配点：２）学生Ａ及びＢは、【会話】のとおり議論している。【会話】中の①から⑪までの（          ）内に【語句群】から適切なものを入れた場合、正しいものの組合せは１から５までのうちどれか。なお、①から⑪までの（       ）内には、それぞれ異なるものが入る。（解答欄は、［No.11］）【会     話】学生Ａ．毀棄及び隠匿の罪にいう「毀棄」、「損壊」の意義について、私は、（①）と考えます。その理由は、（②）です。私の立場からは、隠匿は毀棄・損壊に（③）ので、信書隠匿罪の規定は（④）であると考えます。学生Ｂ．Ａさんの見解に対しては、（⑤）があり、その批判は的を射ていると思います。私は、毀棄及び隠匿の罪にいう「毀棄」、「損壊」の意義について、（⑥）と考えます。その理由は、（⑦）です。また、私の立場からは、隠匿は毀棄・損壊に（⑧）ので、信書隠匿罪の規定は、（⑨）であると考えます。学生Ａ．Ｂさんの見解に対しては、（⑩）があり、その批判の方が当たっていると思います。例えば、Ｂさんの見解によれば、飲食店の食器に放尿して心理的に利用困難にした場合、器物損壊罪が（⑪）ことになりますが、そのような結論でよいのでしょうか。学生Ｂ．私は、そのような結論は妥当だと考えます。私のように考えた方が、判例の立場とも整合します。【語句群】ａ．対象物の効用を害する一切の行為をいうｂ．対象物の全部又は一部を物理的に破壊・毀損することをいうｃ．毀棄・損壊がもたらす財物侵害の本質は、対象物が具備する経済的価値・使用価値などの効用が不利益に変更される点にあるので、物理的な破壊・毀損のみに限定する理由はないからｄ．毀棄・損壊概念の本来の意義は、対象物の全部又は一部を物理的に破壊・毀損し、その結果としてその対象物の効用を害することにあるからｅ．含まれる          ｆ．含まれないｇ．信書の隠匿のみを特に軽く処罰する、器物損壊罪の減軽規定ｈ．信書についてのみ隠匿を特に処罰する、器物損壊罪の拡張規定ｉ．物理的な破壊・毀損によらずに物の効用を害する行為を一切不可罰にすることになり、処罰範囲が狭きに失するとの批判ｊ．毀棄・損壊概念の日常用語的意味からの隔たりが大きく、処罰範囲を不当に拡大する危険性を内在させているとの批判ｋ．成立する          ｌ．成立しない","options":[["1","①ａ    ③ｅ   ⑥ｂ   ⑨ｇ"],["2","①ｂ    ⑤ｊ   ⑥ａ   ⑩ｉ"],["3","②ｃ    ④ｇ   ⑦ｄ   ⑩ｊ"],["4","②ｄ    ④ｈ   ⑦ｃ   ⑪ｋ"],["5","③ｆ    ⑤ｉ   ⑧ｅ   ⑨ｈ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":10,"body":"〔第10問〕（配点：２）アからオまでの各記述を判例の立場に従って検討し、正しいものを全て選んだ場合の組合せは１から５までのうちどれか。（解答欄は、［No.12］）ア．窃盗罪の幇助犯が成立するには、幇助行為を終えていることは必要であるが、正犯者が実行に着手したことまでは必要ない。イ．助言によって他人の犯罪に関与した場合、その助言が、犯行を決意させたときは教唆犯であり、既に犯行を決意している者に対しその決意を強固にしたときは幇助犯である。ウ．幇助犯は、不作為による場合には成立し得ない。エ．幇助犯の成立には、幇助者の側に正犯者の行為を認識してこれを幇助する意思があれば足り、正犯者が幇助者の幇助行為を認識している必要はない。オ．凶器を他人に提供し、その他人が正犯者に同凶器を更に提供して、正犯者が同凶器を用いて犯行に及んだ場合、正犯者の犯行を間接的に幇助したものとして幇助犯が成立し得る。","options":[["1","ア ウ   ２．ア イ オ      ３．イ エ オ    ４．ウ オ   ５．イ エ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":11,"body":"〔第11問〕（配点：２）学生Ａ及びＢは、【会話】のとおり議論している。【会話】中の①から⑨までの（           ）内に【語句群】から適切なものを入れた場合、正しいものの組合せは１から５までのうちどれか。なお、①から⑨までの（       ）内には、それぞれ異なるものが入る。（解答欄は、［No.13］）【会    話】学生Ａ．死体損壊等罪の保護法益について、どのように考えますか。学生Ｂ．私は、（①）であると考えます。学生Ａ．Ｂさんの見解に対しては、（②）がありますね。私は、死体損壊等罪の保護法益については、（③）であると考えます。私のように考えた方が、判例の立場とも整合的だと思います。学生Ｂ．死体損壊等罪にいう「遺棄」に不作為が含まれるかについては、どのように考えますか。学生Ａ．私は、判例と同様、死体損壊等罪にいう「遺棄」に不作為は（④）と考えます。例えば、甲が、野外でＸを出産し、Ｘを砂中に生き埋めにして殺害し、そのまま立ち去った場合、甲には葬祭義務が（⑤）ので、甲に（⑥）と考えます。学生Ｂ．では、乙が、路上で見ず知らずのＹを殺害し、Ｙの死体をその路上に放置したまま逃走した場合は、どのように考えますか。学生Ａ．乙には葬祭義務が（⑦）ので、乙に（⑧）と考えます。学生Ｂ．ところで、殺人罪と死体損壊等罪の両罪が成立する場合の罪数関係については、どのように考えますか。学生Ａ．この点についても、私は、判例と同様、（⑨）になると考えます。【語句群】ａ．死者の人格権や生前の自己決定             ｂ．死者に対する一般的な宗教的感情や敬けん感情ｃ．死者は権利主体であり得ない以上、死者本人の法益侵害を観念するのは妥当でないし、死者本人の意思を絶対視するのは結論的にも妥当でないとの批判ｄ．葬送に関する価値観が多様化しているのであるから、本人の生前の意思にかなった死体の取扱いは死体損壊等罪には当たらないと考えるべきとの批判ｅ．含まれる            ｆ．含まれない    ｇ．ある    ｈ．ないｉ．死体遺棄罪が成立する             ｊ．死体遺棄罪は成立しないｋ．牽連犯            ｌ．併合罪","options":[["1","①ａ    ③ｂ    ⑤ｇ   ⑧ｉ"],["2","①ａ    ③ｂ    ⑥ｉ   ⑨ｋ"],["3","①ｂ    ③ａ    ⑤ｈ   ⑧ｊ"],["4","②ｃ    ④ｅ    ⑦ｈ   ⑨ｌ"],["5","②ｄ    ④ｆ    ⑥ｊ   ⑦ｇ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":12,"body":"〔第12問〕（配点：２）アからオまでの各記述を判例の立場に従って検討した場合、誤っているものの個数を後記１から５までの中から選びなさい。（解答欄は、［No.14］）ア．甲は、電話線を盗もうと考え、Ａ社が管理する電柱に架設されたＡ社所有の電話線１本を切断していたところ、警察官に発見されたため、完全に切断することはできなかった。この場合、甲には窃盗未遂罪が成立する。イ．甲は、Ａから金を脅し取ろうと考え、「殺されたくなければ１０００万円を払え。」などとＡを恐喝する内容の手紙を郵便ポストに投かんして同手紙をＡ方に配達させたところ、同手紙を読んだＡの妻は冗談であると思い、同手紙の存在をＡに伝えることなく同手紙を捨てたため、Ａは同手紙の内容を知ることはなかった。この場合、甲には恐喝未遂罪が成立する。ウ．甲は、知人Ａから金を奪おうと考え、Ａ方を訪ねてＡと二人きりになった際にＡを縛り上げ、持参したボストンバッグにＡ方設置の金庫内の現金を詰め込み、Ａ方玄関に向かおうとしたところ、駆けつけた警察官にＡ方内で逮捕されたため、Ａ方の外に出ることはできなかった。この場合、甲には強盗既遂罪が成立する。エ．甲は、自己が居住する建物に付された火災保険の保険金をＡ保険会社からだまし取ろうと考え、同建物に放火して全焼させたが、同放火の被疑事実で逮捕されたため、保険金を請求するに至らなかった。この場合、甲には詐欺未遂罪が成立する。オ．甲は、Ａが居住している木造平屋を焼損しようと考え、同平屋に隣接するＡ所有の無人の木造倉庫に火を放ち、その燃焼作用により同平屋の延焼を惹起すべき状態を作出したが、火災に気付いたＡが消火したため、同倉庫の天井等が一部焼損したにとどまり、同平屋は全く燃えなかった。この場合、甲には現住建造物等放火未遂罪が成立する。","options":[["1","０個   ２．１個   ３．２個   ４．３個   ５．４個"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"刑法・刑事訴訟法","subject":"刑法","number":13,"body":"〔第13問〕（配点：４）【事例】に関するアからオまでの各【記述】を判例の立場に従って検討し、正しい場合には１を、誤っている場合には２を選びなさい。（解答欄は、アからオの順に［No.15］から［No.19］）【事    例】甲は、偶然、Ａ方に夕方まで家人がいないことを知ったことから、Ａ方に侵入して金品を窃取しようと考えた。甲は、Ａ方に侵入して金品を窃取している最中にＡ又はＡ方の家人が帰宅した場合に備え、窃取した金品の取戻しを防ぐために使う目的で、自宅から出刃包丁を持ち出し、自転車に乗ってＡ方に向かった（①）。甲は、Ａ方に近づいた際、予想外にＡが帰宅していることに気付いたことから、自ら実行すると検挙される可能性が高いと考え、１２歳の長男乙を呼び出して、乙に上記出刃包丁を手渡し、同出刃包丁をＡに突き付けて脅迫する方法によりＡから金品を強取してくるよう指示した。乙には是非弁別能力があり、甲の指示は乙の意思を抑圧するものではなかった。乙は、小遣い欲しさから、自らの意思により強盗の犯行を決意して、その指示を承諾した。その後、乙は、Ａ方内に侵入し、上記出刃包丁をＡに突き付けて脅迫した上、Ａ方にあった電源コードでＡを緊縛するなど臨機応変に対処して、Ａ所有のネックレス（時価７０万円相当）を強取した（②）。その後、甲は、自ら上記ネックレスを売却すると検挙される可能性が高まると考え、知人の丙に対し、Ａ方から同ネックレスを強取したことを話した上で、同ネックレスの売却のあっせんを無報酬で依頼した。丙は、甲から、上記ネックレスを受け取り、丁にその買取りを持ち掛け、これに応じた丁に同ネックレスを５０万円で売却した（③）。丙は、丁から上記５０万円を受け取ったが、自身も金に困っていたため、売却後、同５０万円を自己の借金返済に充てようという気持ちが芽生え、甲に無断で同５０万円を丙自身の借金返済に費消した（④）。甲は、丙に対し、上記売却代金を引き渡すよう求めたところ、丙が使い込みを認めたことから、丙に対し、甲が運転する自動車を故意に丙に衝突させて丙に傷害を負わせた上で、甲の過失による交通事故であるように装って保険金を詐取しようと持ち掛け、丙がこれを了承した。甲は、自身が運転する自動車を歩行中の丙に故意に衝突させ、丙に全治約１か月間を要する骨盤骨折等の傷害を負わせた（⑤）。【記    述】ア．①につき、Ａ方に向かう途中で甲が警察官の職務質問を受けて検挙された場合、甲に強盗予備罪は成立しない。［No.15］イ．②につき、甲に強盗罪の間接正犯は成立しない。［No.16］ウ．③につき、丙に盗品等有償処分あっせん罪は成立しない。［No.17］エ．④につき、丙に横領罪は成立しない。［No.18］オ．⑤につき、甲に傷害罪は成立しない。［No.19］","options":[],"binary":false,"chooseTwo":false,"statements":[],"answer":"ア2・イ1・ウ2・エ2・オ2"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":14,"body":"〔第14問〕（配点：２）異議申立てに関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までのうちどれか。（解答欄は、［№20］）ア．弁護人は、検察官が起訴状を朗読した後、起訴状の記載内容に不明確な点があるとして裁判長に対して検察官に釈明を求めるように申し立てたが、裁判長が釈明を求めなかったことに対し、相当でないことを理由として適法に異議を申し立てることができる。イ．検察官は、証人尋問において、弁護人の尋問に対し、相当でないことを理由として適法に異議を申し立てることができる。ウ．合議体の裁判長は、証人尋問において、検察官の尋問に対する弁護人の異議申立てに対して決定をするに当たっては、迅速かつ機動的な処理を要するという事柄の性質上、陪席裁判官との合議を経る必要はない。エ．弁護人は、検察官請求証拠を採用して取り調べるとの裁判所の決定に対し、相当でないことを理由として適法に異議を申し立てることができる。オ．異議申立ては、個々の行為、処分又は決定ごとに直ちにしなければならず、裁判所は、時機に遅れてされた異議申立てについては、決定で却下しなければならないが、申し立てられた事項が重要であってこれに対する判断を示すことが相当であると認めるときは、時機に遅れたことを理由としてこれを却下してはならない。","options":[["1","ア    ウ   ２．ア   エ   ３．イ   ウ    ４．イ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":15,"body":"〔第15問〕（配点：２）伝聞証拠に関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。（解答欄は、［№21］）ア．司法警察員が警察犬による臭気選別の経過及び結果を記載した報告書は、選別に立ち会った司法警察員が臭気選別の経過と結果を正確に記載したものであることを証言によって明らかにしても、刑事訴訟法第３２１条第３項により証拠能力が認められることはない。イ．司法警察員が被害者に被害状況を再現させた結果を記載した実況見分調書は、再現されたとおりの被害があったことが要証事実である場合で、刑事訴訟法第３２６条の同意が得られないとき、その証拠能力が認められるためには、同法第３２１条第３項所定の要件を満たす必要があることはもとより、再現写真については、再現者の署名押印を除く同条第１項第３号所定の要件を満たす必要がある。ウ．司法警察員が作成した酒酔い鑑識カードのうち、被疑者の言語、動作、酒臭、外貌、態度等の外部的状態に関する所定の項目につき観察した結果を所定の評語に印をつける方法によって記入した欄は、司法警察員の主観的判断によるものであって必ずしも検証の結果を記載したものということはできないため、その記載部分が刑事訴訟法第３２１条第３項の書面に該当することはない。エ．捜査機関の嘱託に基づき作成された鑑定書は、裁判所が命じた鑑定の結果を記載した書面とはその性質を異にするため、刑事訴訟法第３２１条第４項の書面に準ずるものとして同項により証拠能力が認められることはない。オ．火災原因の調査、判定に関して特別の学識経験を有する私人が作成した燃焼実験報告書は、同実験に捜査機関の実況見分に準ずるだけの客観性、業務性が認められる場合には、刑事訴訟法第３２１条第４項の書面に準ずるものとして同項により証拠能力が認められる場合がある。","options":[["1","ア    イ   ２．ア   ウ   ３．イ   オ    ４．ウ   エ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":16,"body":"〔第16問〕（配点：３）次の【事例】における【Ｖの証人尋問】中の①から⑤までの下線部分にそれぞれ対応する後記アからオまでの【記述】のうち、正しいものには１を、誤っているものには２を選びなさい。（解答欄は、アからオの順に［№22］から［№26］）【事    例】甲は、令和７年９月１９日午後１１時頃、自宅で、妻である被害者Ｖに対し、頭部をガラス製の灰皿で１回殴る暴行を加えてけがを負わせた傷害事件で公判請求された。甲は、第１回公判期日において、「公訴事実記載の日時場所においてＶと一緒にいたことは間違いない。もっとも、Ｖに暴行を加えてけがを負わせたことはなく、Ｖが自分で転んでけがを負ったものである。」旨を述べて犯行を否認した。甲の弁護人は、同期日において、被告人は無罪である旨を主張するとともに、検察官請求証拠として開示を受けていた(a)灰皿及び(b)Ｖの検察官に対する供述調書について、(a)は異議あり、(b)は不同意の意見を述べたが、甲が公訴事実記載の日時場所においてＶと一緒にいた事実については争わない旨を述べた。検察官は、第２回公判期日において、立証趣旨を「本件被害状況等」として、Ｖの証人尋問を請求し、裁判所の証拠調べをする決定を経て、次のとおりＶの証人尋問を行った。なお、同証人尋問の段階では、前記(a)及び(b)の証拠調べをする決定及び証拠調べはなされていない。【Ｖの証人尋問】検察官       ①あなたは、被告人甲の妻ですね。Ｖ         はい。検察官       ②あなたは、令和７年９月１９日午後１１時頃、自宅で、甲と一緒にいましたね。Ｖ         はい。検察官       自宅で、何が起こりましたか。Ｖ         甲と口論になりました。検察官       ③そのとき、甲は、どのようにあなたを殴ってきたのですか。Ｖ         甲は、ソファーに座っていた私の正面に立って、私の頭のてっぺん辺りを、テーブルに置いてあった灰皿で１回殴ってきました。検察官       その灰皿は、どういった特徴のものでしたか。Ｖ         ガラス製の四角い形をした灰皿で、事件後に刑事さんに提出しました。検察官       ④同一性を確認するために、弁護人に開示済みの灰皿を示します。これは、あなたが証言した灰皿と同じものですか。Ｖ         はい。私が証言した灰皿です。検察官       甲から灰皿で１回殴られた後、どうなりましたか。Ｖ         どうだったかな。検察官       捜査段階で、その点について、検察官に話をしたことはありませんか。Ｖ         したと思います。ただ、そのとき検察官にどのような話をしたか思い出せません。検察官       ⑤証人が思い出せないようなので、記憶喚起のために、弁護人に開示済みのＶの検察官に対する供述調書の供述部分を示します。（以下省略）【記    述】ア．下線部①の尋問は、主尋問における誘導尋問であるが、証人の身分等で実質的な尋問に入るに先立って明らかにする必要のある準備的な事項に関するものであるので許される。［№22］イ．下線部②の尋問は、主尋問における誘導尋問であるが、甲及び甲の弁護人に争いのないことが明らかであるので許される。［№23］\nウ．下線部③の尋問は、Ｖがいまだ供述していない殴打の事実を前提としているので、許されない誘導尋問である。［№24］エ．下線部④の尋問による証拠物の提示は、裁判長の許可がなければ許されない。［№25］オ．下線部⑤の尋問による書面の提示は、裁判長の許可があれば許される。［№26］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．下線部①の尋問は、主尋問における誘導尋問であるが、証人の身分等で実質的な尋問に入るに先立って明らかにする必要のある準備的な事項に関するものであるので許される。［№22］"],["イ","イ．下線部②の尋問は、主尋問における誘導尋問であるが、甲及び甲の弁護人に争いのないことが明らかであるので許される。［№23］"],["ウ","ウ．下線部③の尋問は、Ｖがいまだ供述していない殴打の事実を前提としているので、許されない誘導尋問である。［№24］"],["エ","エ．下線部④の尋問による証拠物の提示は、裁判長の許可がなければ許されない。［№25］"],["オ","オ．下線部⑤の尋問による書面の提示は、裁判長の許可があれば許される。［№26］"]],"answer":"11122"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":17,"body":"〔第17問〕（配点：２）接見交通権に関する次のアからオまでの各記述のうち、正しいものは幾つあるか。後記１から６までのうちから選びなさい。ただし、判例がある場合には、それに照らして考えるものとする。（解答欄は、［№27］）ア．身体の拘束を受けている被告人又は被疑者が立会人なくして接見できる相手は、選任された弁護人に限られ、弁護人選任権を有する者の依頼を受けた弁護士とは立会人なくして接見することができない。イ．弁護人は、被疑者と立会人なくして接見することができるが、物の授受は意思や情報の伝達とは関係ないので、被疑者と物の授受をすることはできない。ウ．接見交通権は、身体を拘束された被疑者が弁護人の援助を受けることができるための刑事手続上最も重要な基本的権利であるとともに、弁護人の固有権の最も重要なものの一つである。エ．身体拘束を受けている被疑者には、罪証隠滅又は逃亡のおそれがあるから、検察官は、捜査のため必要がなくとも、公訴提起の前まで、弁護人との接見の日時、場所及び時間を指定することができる。オ．弁護人は、検察官のした接見指定について、裁判所にその処分の取消し又は変更を請求することができる。","options":[["1","０個   ２．１個     ３．２個   ４．３個     ５．４個   ６．５個"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"3"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":18,"body":"〔第18問〕（配点：２）次の【事例】に関する後記アからオまでの【記述】のうち、誤っているものは幾つあるか。後記１から６までのうちから選びなさい。ただし、判例がある場合には、それに照らして考えるものとする。（解答欄は、［№28］）【事    例】司法警察員Ｘは、甲が自宅の居室で覚醒剤を使用しているとの情報を入手し、捜査を開始した。Ｘは、甲の自宅付近の公道上を歩いている甲を発見したため、①甲の容貌を写真撮影した。その後、Ｘは、②甲の自宅付近の公道上にあるごみ集積所に甲が排出したごみ袋を領置し、その中から血液の混じったような液体が入った注射器を発見した。そして、Ｘは、同液体に覚醒剤及び血液が含まれているとの鑑定結果並びに同血液のＤＮＡ型の鑑定結果を得た。Ｘは、その後の捜査を踏まえ、捜索差押許可状の発付を受け、甲立会いの下、甲の居室の捜索を実施したところ、白色の粉末が入ったビニール袋を発見した。Ｘは、甲の同意を得て同粉末の検査を行ったところ、同粉末は覚醒剤であることが判明したため、甲を覚醒剤取締法違反（所持）の疑いで現行犯逮捕することとしたが、甲は同居室から逃走した。Ｘは、甲を逮捕すべく追跡していた際、甲が付近にあった一軒家（乙方）に入るのを見たため、③乙方に入って甲を捜索し、乙方内で甲を発見して逮捕した。その後、Ｘは、甲を警察署まで引致し、甲に尿を提出させようとしたが、甲は錯乱状態でこれに応じなかった。そこで、Ｘは、④甲を病院まで連れて行き、医師をして強制的に採尿をさせた。翌日、Ｘは、⑤甲にＤＮＡ型を鑑定するために必要である旨説明した上で、甲の同意を得て口腔内細胞を採取し、甲のＤＮＡ型の鑑定結果を得た。【記    述】ア．下線部①について、Ｘが、甲に秘して甲の容貌を写真撮影することは、裁判官による令状の発付を受けていなくとも適法と評価される余地がある。イ．下線部②について、Ｘが、公道上にあるごみ集積所に甲が排出したごみ袋を領置することは、裁判官による令状の発付を受けていなくとも適法と評価される余地がある。ウ．下線部③について、Ｘは、乙の承諾がなくとも、乙方に入り、甲の捜索をすることができ、その際、裁判官による令状の発付を受ける必要はない。エ．下線部④について、甲が錯乱状態で任意に尿を提出することが期待できない状態であれば、医師をして甲から強制的に採尿をさせるに当たり、Ｘは、裁判官による令状の発付を受ける必要はない。オ．下線部⑤について、採取された甲の口腔内細胞を試料として、甲のＤＮＡ型の鑑定をするに当たり、Ｘは、裁判官による令状の発付を受ける必要はない。","options":[["1","０個        ２．１個   ３．２個   ４．３個     ５．４個   ６．５個"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":19,"body":"〔第19問〕（配点：２）保釈に関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までのうちどれか。（解答欄は、［№29］）ア．裁判所は、保釈の請求がない場合又は刑事訴訟法第８９条各号所定の事由がある場合のいずれであっても、適当と認めるときは、職権で保釈を許すことができる。イ．裁判官は、勾留中の被疑者であっても、犯罪の性質や情状によっては、保釈を許すことができる。ウ．裁判所は、被告人の住居を制限し、その他適当と認める条件を付して、保釈を許すことができる。エ．裁判所は、検察官に意見を述べる機会を与えなくても、保釈を許すことができる。オ．裁判所は、犯罪の性質や被告人の資産を考慮し、納付すべき保証金額を定めなくても、保釈を許すことができる。","options":[["1","ア    イ      ２．ア   ウ   ３．ウ   エ    ４．イ   オ   ５．エ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":20,"body":"〔第20問〕（配点：３）警察官職務執行法上の職務質問に関する次のアからオまでの各記述のうち、正しいものには１を、誤っているものには２を選びなさい。ただし、判例がある場合には、それに照らして考えるものとする。（解答欄は、アからオの順に［№30］から［№34］）ア．警察官は、職務質問を行うためには、対象となる犯罪の具体的な内容を特定する必要がある。［№30］イ．警察官は、犯罪を犯したと疑うに足りる相当な理由がある者だけではなく、既に行われた犯罪について知っていると認められる者に対しても、職務質問を行うことができる。［№31］ウ．警察官は、職務質問において、有形力を行使することは一切許されない。［№32］エ．警察官は、職務質問のため、対象者をその場に停止させて質問することはできるが、付近の警察署に同行することを求めることはできない。［№33］オ．警察官職務執行法には所持品検査の規定はないから、警察官は、職務質問に付随して所持品検査を行うことはできない。［№34］","options":[],"binary":true,"chooseTwo":false,"statements":[["ア","ア．警察官は、職務質問を行うためには、対象となる犯罪の具体的な内容を特定する必要がある。［№30］"],["イ","イ．警察官は、犯罪を犯したと疑うに足りる相当な理由がある者だけではなく、既に行われた犯罪について知っていると認められる者に対しても、職務質問を行うことができる。［№31］"],["ウ","ウ．警察官は、職務質問において、有形力を行使することは一切許されない。［№32］"],["エ","エ．警察官は、職務質問のため、対象者をその場に停止させて質問することはできるが、付近の警察署に同行することを求めることはできない。［№33］"],["オ","オ．警察官職務執行法には所持品検査の規定はないから、警察官は、職務質問に付随して所持品検査を行うことはできない。［№34］"]],"answer":"21222"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":21,"body":"〔第21問〕（配点：２）次のⅠからⅢまでの【見解】は、刑事訴訟法第３２６条の同意（以下「同意」という。）の性質に関する考え方を述べたものである。これらの【見解】について述べた後記アからオまでの【記述】のうち、正しいものの組合せは、後記１から５までのうちどれか。（解答欄は、［№35］）【見    解】Ⅰ．同意は、公判において供述者に対して反対尋問をする権利を放棄する訴訟行為である。Ⅱ．同意は、公判において証拠に対して証拠能力を付与する訴訟行為である。Ⅲ．同意は、原供述時において供述者に対して反対尋問をすることができなかったこと、又は原供述時において裁判所が供述者の供述態度を観察することができなかったことについて責問権を放棄する訴訟行為である。【記    述】ア．Ⅰの見解に対しては、刑事訴訟法第３２６条第１項が被告人の供述調書を同意の対象としていることを説明することができないという批判がある。イ．Ⅰの見解に対しては、捜索差押手続が違法であっても、同意によって同手続の捜索差押調書に証拠能力が付与されることになり不当であるという批判がある。ウ．Ⅱの見解に対しては、伝聞証拠の証拠能力が否定される根拠と同意の性質が関連しなくなり、刑事訴訟法第３２６条が同法第３２０条第１項により証拠能力が否定される伝聞証拠について証拠能力を認める規定であることにそぐわないという批判がある。エ．Ⅲの見解に対しては、直接主義の観点が欠落しているという批判がある。オ．Ⅲの見解に対しては、検察官が請求した被告人以外の者の供述調書について、被告人側がそれを証拠とすることに同意した上で、その証明力を争うために供述者の証人尋問を請求することができないことになるという批判がある。","options":[["1","ア    ウ    ２．ア   エ   ３．イ   エ    ４．イ   オ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"1"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":22,"body":"〔第22問〕（配点：３）次の【事例】に関し、自白の補強証拠について述べた後記アからオまでの【記述】のうち、正しいものの組合せは、後記１から５までのうちどれか。ただし、判例がある場合には、それに照らして考えるものとする。なお、甲の自白を含む各証拠について、その証拠能力及び証明力に問題はないものとする。（解答欄は、［№36］）【事    例】甲は、令和８年４月５日、警察署を訪れ、司法警察員Ｋに対し、「私は、以前からＶを恨んでおり、乙と共に、Ｖを殺してＶの死体を海に捨てる計画を立てていた。私は、この計画に従い、まず、令和８年２月１５日午後６時頃、乙の家で、乙と一緒にＶを殺した。私がＶを後ろから羽交い締めにしている間、乙が両手でＶの首を絞めてＶを殺した。その１時間後、私は、乙から指示され、私一人で、乙が所有する自動車にＶの死体を載せ、乙の家から１０キロメートル離れたところにある岸壁までこの自動車を運転してＶの死体を運び、この岸壁からＶの死体を海に捨てた。私は、これまで一度も運転免許を取得したことはなかったが、乙は、そのことを知らなかったと思う。」などと供述し、殺人、死体遺棄、道路交通法違反（無免許運転）の罪を自白した。そこで、Ｋは、このような甲の自白を内容とする供述調書（以下「本件調書」という。）を作成した。他方、Ｋは、乙に対する取調べを行ったが、乙は一切の供述を拒否したため、乙の供述を内容とする供述調書は作成されなかった。その後、甲及び乙は、いずれも、殺人罪及び死体遺棄罪の各共同正犯で起訴された。また、甲は、道路交通法違反（無免許運転）の罪についても併せて起訴された。甲及び乙のこれらの罪については、併合審理されることになった。【記    述】ア．公判期日における被告人質問に際し、甲が殺人罪について自白した場合、本件調書をこの自白の補強証拠とすることができる。イ．本件調書を唯一の証拠として甲を殺人罪で有罪とすることはできないが、本件調書を唯一の証拠として乙を殺人罪で有罪とすることはできる。ウ．甲を殺人罪で有罪とするには、甲の実行行為のみならず、甲の故意についても、補強証拠が必要不可欠である。エ．甲を死体遺棄罪で有罪とするには、Ｖの死体を撮影した写真等のＶの死体の発見を前提とする補強証拠が必要不可欠である。オ．甲を道路交通法違反（無免許運転）の罪で有罪とするには、甲の運転行為のみならず、甲が無免許であることについても、補強証拠が必要不可欠である。","options":[["1","ア    ウ    ２．ア   エ   ３．イ   エ    ４．イ   オ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":23,"body":"〔第23問〕（配点：２）裁判員裁判に関する次のアからオまでの各記述のうち、正しいものの組合せは、後記１から５までのうちどれか。（解答欄は、［№37］）ア．法令の解釈に係る判断については、裁判官のみの合議によってなされる。イ．裁判所は、裁判員裁判の対象事件について、公判前整理手続において、鑑定人に鑑定の経過及び結果の報告を含む鑑定の手続を行わせることができる。ウ．裁判所が事実の認定について証人を尋問する場合、裁判員は証人に対して直接質問することはできず、裁判長に尋問事項を告げ、裁判長が証人に質問する方法によらなければならない。エ．裁判官３名、裁判員６名の合議体の評議において事実の認定に関する判断を行うに当たり、裁判員５名が有罪の意見、その他の者が無罪の意見と分かれた場合、合議体の員数の過半数である裁判員５名の意見に基づき有罪の判断となる。オ．裁判所は、裁判員裁判の対象事件については、第１回の公判期日前に、これを公判前整理手続に付さなければならない。","options":[["1","ア    エ    ２．ア   オ   ３．イ   ウ    ４．イ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"2"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":24,"body":"〔第24問〕（配点：２）次のⅠ及びⅡの【見解】は、刑事訴訟法第２２０条第１項第２号及び同条第３項において、逮捕の現場における令状によらない捜索差押えが認められている根拠に関する考え方を述べたものである。これらの【見解】に関する後記アからオまでの【記述】のうち、正しいものの組合せは、後記１から５までのうちどれか。（解答欄は、［№38］）【見    解】Ⅰ．逮捕の現場や被逮捕者の身体及び所持品には被疑事実に関連する証拠が存在する蓋然性が一般的に高いので、合理的な証拠収集手段として認められる。Ⅱ．逮捕の際には被逮捕者等により証拠が隠滅されるおそれが大きいので、これを防止して証拠を保全する緊急の必要性があるために認められる。【記    述】ア．Ⅰの見解に立つと、令状によらない捜索が認められる範囲は、被逮捕者の身体並びにその直接の支配下にある場所及び物件に限られることになる。イ．Ⅰの見解に立つと、令状によらない捜索が開始された時点で、逮捕行為に着手している必要はないと考えることができる。ウ．Ⅱの見解に立つと、令状によらない捜索差押えが認められるのは、現行犯逮捕や緊急逮捕の場合に限られ、通常逮捕の場合には認められないことになる。エ．Ⅰ及びⅡの見解のいずれに立ったとしても、令状によらない差押えの対象には、逮捕の理由とされた被疑事実以外の事実に関する証拠物も含まれることになる。オ．Ⅰ及びⅡの見解のいずれに立ったとしても、緊急逮捕に伴う令状によらない捜索差押えを実施した後、逮捕状が発付されなかった場合には、差押物は直ちにこれを還付しなければならない。","options":[["1","ア    ウ    ２．ア   エ   ３．イ   エ    ４．イ   オ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":25,"body":"〔第25問〕（配点：３）次のⅠ及びⅡの【見解】は、逮捕・勾留中の被疑者に、被疑事実に係る取調べのために取調室に出頭し、そこに滞留する義務が認められるか否かという解釈問題に関するものであり、（１）から（５）までの【論拠】は、Ｉ・Ⅱのいずれかの見解の論拠を述べたものである。【見解】と【論拠】を組み合わせた後記アからオまでのうち、正しいものは幾つあるか。後記１から６までのうちから選びなさい。（解
