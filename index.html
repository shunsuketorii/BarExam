答欄は、［№39］）【見    解】Ⅰ．前記義務が認められる。Ⅱ．前記義務は認められない。【論    拠】（１）取調べをすることは、逮捕・勾留の目的には含まれない。（２）出頭・滞留を義務付けることが直ちに供述を義務付けることを意味するわけではない。（３）当事者主義の下、被疑者は、単なる捜査の客体としてではなく、より主体的な存在として扱われるべきである。（４）刑事訴訟法第１９８条第１項ただし書を反対解釈すべきである。（５）刑事訴訟法第１９８条第１項ただし書は、取調室への出頭拒否やそこからの退去を認めることが逮捕・勾留の効力自体を失わせるものでないことを注意的に規定したものと解すべきである。ア．Ⅰ（１）           イ．Ⅰ（２）    ウ．Ⅱ（３）    エ．Ⅰ（４）      オ．Ⅱ（５）","options":[["1","０個        ２．１個      ３．２個    ４．３個    ５．４個      ６．５個（参照条文）刑事訴訟法第１９８条第１項         検察官、検察事務官又は司法警察職員は、犯罪の捜査をするについて必要があるときは、被疑者の出頭を求め、これを取り調べることができる。但し、被疑者は、逮捕又は勾留されている場合を除いては、出頭を拒み、又は出頭後、何時でも退去することができる。"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"5"},{"category":"刑法・刑事訴訟法","subject":"刑事訴訟法","number":26,"body":"〔第26問〕（配点：２）次の【事例】について述べた後記アからオまでの【記述】のうち、正しいものの組合せは、後記１から５までのうちどれか。（解答欄は、［№40］）【事    例】司法巡査Ｘは、夜間、路上を巡回中、甲がＶ方敷地内から塀を乗り越えて出てくるのを現認したことから、甲に対し、職務質問を開始したところ、甲が窃盗目的でＶ方に侵入したことを自白した。Ｘは、甲を住居侵入罪の現行犯人として逮捕し、直ちに司法警察員Ｙに引致した。その後の捜査により、甲が前記侵入時にＶ方において窃盗に及んだことや、甲には住居侵入・窃盗罪で拘禁刑の実刑判決を受けて刑務所に服役した前科があり、本件犯行日の１か月前にその刑の執行を終えていたことが判明した。Ｙは、逮捕の翌日、住居侵入の被疑事実のみで甲を検察官に送致する手続をした。【記    述】ア．Ｘは、甲を現行犯人として逮捕するに際し、あらかじめ、甲に対し、逮捕の理由となった犯罪事実の要旨を告げなければならない。イ．Ｘから甲を受け取ったＹは、留置の必要があると思料するときは、甲を受け取った時から４８時間以内に書類及び証拠物とともにこれを検察官に送致する手続をしなければならない。ウ．検察官は、住居侵入の事実のみならず窃盗の事実も併せ、住居侵入・窃盗の被疑事実で甲の勾留を請求することができる。エ．甲の勾留の請求を受けた裁判官は、甲に【事例】中の前科があることを「逃亡し又は逃亡すると疑うに足りる相当な理由」（刑事訴訟法第６０条第１項第３号）を肯定する方向の事情として考慮することができる。オ．甲が勾留された場合において、その勾留の期間は、検察官が勾留の請求をした日から１０日間であるが、裁判官は、やむを得ない事由があると認めるときは、検察官の請求により、１回に限り、その期間を延長することができる。","options":[["1","ア    イ    ２．ア   オ   ３．イ   エ    ４．ウ   エ   ５．ウ   オ"]],"binary":false,"chooseTwo":false,"statements":[],"answer":"4"}];
const groups=[...new Set(DATA.map(q=>q.category))];
let currentGroup=null,currentQ=null,answered=false,score=0,total=0;
const subjectEl=document.getElementById('subjects');
groups.forEach(g=>{const qs=DATA.filter(q=>q.category===g);const d=document.createElement('button');d.className='subject';d.innerHTML=`<h2>${esc(g)}</h2><p>${qs.length}問</p>`;d.onclick=()=>start(g);subjectEl.appendChild(d)});
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function start(g){currentGroup=g;score=0;total=0;nextQuestion();show('quiz')}
function nextQuestion(){const qs=DATA.filter(q=>q.category===currentGroup);currentQ=qs[Math.floor(Math.random()*qs.length)];answered=false;total++;render();}
function flattenOptions(raw){
  const out=[];
  const norm=s=>String(s).replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xfee0));

  raw.forEach(o=>{
    const rawLabel=norm(o[0]).trim();
    const text=norm(String(o[1])).trim();

    // 原本データでは「1．… ２．… ３．…」のように、
    // 複数の選択肢が1つの配列要素に連結されている場合がある。
    // 全角数字を半角化した上で、各「番号．」を境界として分割する。
    const re=/(?:^|[\s　])([1-8])(?:[．.])/g;
    const matches=[];
    let m;
    while((m=re.exec(text))!==null){
      matches.push({label:m[1], start:m.index, end:re.lastIndex});
    }

    if(matches.length===0){
      out.push([rawLabel,text]);
      return;
    }

    // 最初の番号より前は rawLabel の本文。
    const prefix=text.slice(0,matches[0].start).trim();
    if(prefix) out.push([rawLabel,prefix]);

    // 「2．」「3．」…をそれぞれ独立した選択肢として生成。
    for(let i=0;i<matches.length;i++){
      const cur=matches[i];
      const next=i+1<matches.length ? matches[i+1].start : text.length;
      const body=text.slice(cur.end,next).trim();
      if(body) out.push([cur.label,body]);
    }
  });

  // 番号の重複を除き、必ず 1,2,3… の順に表示。
  const seen=new Set();
  return out
    .filter(o=>{
      if(seen.has(o[0])) return false;
      seen.add(o[0]);
      return true;
    })
    .sort((a,b)=>Number(a[0])-Number(b[0]));
}

function formatQuestionBody(text){
  let s = String(text);

  // 原本の「ア．」「イ．」…を、それぞれ必ず行頭にする。
  // ここでは文字列中のリテラル "\\n" ではなく、本物の改行文字を挿入する。
  s = s.replace(/\s*(?=(ア|イ|ウ|エ|オ)．)/g, '\n');
  s = s.replace(/\n{3,}/g, '\n\n').trim();

  return s;
}

function formatOptionText(text){
  let s = String(text);

  // 選択肢の中にア～オの列挙がある場合も、各記述を行頭にする。
  s = s.replace(/\s*(?=(ア|イ|ウ|エ|オ)．)/g, '\n');
  s = s.replace(/\n{3,}/g, '\n\n').trim();

  return s;
}
function render(){document.getElementById('meta').textContent=`${currentQ.subject}・第${currentQ.number}問`;document.getElementById('qtitle').textContent=`〔第${currentQ.number}問〕`;document.getElementById('qbody').textContent=formatQuestionBody(currentQ.body);const area=document.getElementById('answerArea');area.innerHTML='';
 if(currentQ.binary){
  currentQ.statements.forEach((s,i)=>{
    const box=document.createElement('div');
    box.className='statement';
    const m=String(s[1]).match(/［No\.\s*([０-９0-9]+)］/);
    const no=m ? m[1] : (i+1);
    box.innerHTML=`<div class="statementText">［No.${esc(no)}］</div><div class="binaryChoices"><button class="bin" data-i="${i}" data-v="1">1</button><button class="bin" data-i="${i}" data-v="2">2</button></div>`;
    box.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{
      if(answered)return;
      box.querySelectorAll('.bin').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected')
    });
    area.appendChild(box)
  })
}
 else if(currentQ.chooseTwo){const opts=document.createElement('div');opts.className='options';flattenOptions(currentQ.options).forEach(o=>{const lab=document.createElement('label');lab.className='opt';lab.innerHTML=`<input type="checkbox" name="ans" value="${o[0]}"><span class="optionNo">${esc(o[0])}．</span><span class="optionText">${esc(formatOptionText(o[1]))}</span>`;opts.appendChild(lab)});area.appendChild(opts)}
 else {const opts=document.createElement('div');opts.className='options';flattenOptions(currentQ.options).forEach(o=>{const lab=document.createElement('label');lab.className='opt';lab.innerHTML=`<input type="radio" name="ans" value="${o[0]}"><span class="optionNo">${esc(o[0])}．</span><span class="optionText">${esc(formatOptionText(o[1]))}</span>`;opts.appendChild(lab)});area.appendChild(opts)}
 document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';document.getElementById('submitBtn').textContent='解答する';document.getElementById('score').textContent=`正解 ${score} / ${total-1}`;
}
function submitAnswer(){if(answered){nextQuestion();return}let ok=false;
 if(currentQ.binary){let vals=[];let all=true;document.querySelectorAll('.statement').forEach(st=>{const sel=st.querySelector('.selected');if(!sel)all=false;vals.push(sel?sel.dataset.v:'')});if(!all){alert('すべての記述について1または2を選択してください。');return}let key=currentQ.answer;if(/^[12]+$/.test(key)){ok=vals.join('')===key}else{const mp={};key.split('・').forEach(x=>{const m=x.match(/([ア-オ])([12])/);if(m)mp[m[1]]=m[2]});ok=currentQ.statements.every((s,i)=>mp[s[0]]===vals[i])}}
 else if(currentQ.chooseTwo){const vals=[...document.querySelectorAll('input[name=ans]:checked')].map(x=>x.value).sort().join('');if(vals.length!==2){alert('2つ選択してください。');return}ok=vals===String(currentQ.answer).split('').sort().join('')}
 else {const sel=document.querySelector('input[name=ans]:checked');if(!sel){alert('解答を選択してください。');return}ok=sel.value===String(currentQ.answer)}
 answered=true;if(ok)score++;const fb=document.getElementById('feedback');fb.className='feedback show '+(ok?'good':'bad');fb.textContent=ok?'正解です。':'不正解です。';if(currentQ.answer)fb.textContent += ` 正解：${currentQ.answer}`;document.getElementById('submitBtn').textContent='次の問題';document.getElementById('score').textContent=`正解 ${score} / ${total}`;
}
function goHome(){show('home')}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
</script></body></html>
